function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      if (!json.data) { toast('올바른 백업 파일이 아닙니다'); return; }
      showModal('데이터 가져오기', `
        <p style="color:var(--text-secondary);font-size:14px">가져오기 방식을 선택하세요.</p>
        <p style="font-size:13px;color:var(--text-muted);margin-top:8px">덮어쓰기: 현재 데이터를 모두 교체합니다<br>병합: 기존 데이터에 추가합니다</p>`,
        [{label:'취소',cls:'btn-secondary',action:'closeModal()'},
         {label:'병합',cls:'btn-secondary',action:`doImport(${JSON.stringify(JSON.stringify(json.data))}, 'merge')`},
         {label:'덮어쓰기',cls:'btn-danger',action:`doImport(${JSON.stringify(JSON.stringify(json.data))}, 'overwrite')`}]);
    } catch(err) {
      toast('JSON 파싱 오류');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function doImport(dataStr, mode) {
  closeModal();
  const data = JSON.parse(dataStr);
  if (mode === 'overwrite') {
    if (data.viral) saveData(KEYS.viral, data.viral);
    if (data.memo) saveData(KEYS.memo, data.memo);
    if (data.calls) saveData(KEYS.calls, data.calls);
    if (data.imgMeta) saveData(KEYS.imgMeta, data.imgMeta);
    if (data.settings) saveSettings(data.settings);
  } else {
    if (data.viral) {
      const existing = getData(KEYS.viral);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.viral, [...existing, ...data.viral.filter(i=>!ids.has(i.id))]);
    }
    if (data.memo) {
      const existing = getData(KEYS.memo);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.memo, [...existing, ...data.memo.filter(i=>!ids.has(i.id))]);
    }
    if (data.calls) {
      const existing = getData(KEYS.calls);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.calls, [...existing, ...data.calls.filter(i=>!ids.has(i.id))]);
    }
    if (data.imgMeta) {
      const existing = getData(KEYS.imgMeta);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.imgMeta, [...existing, ...data.imgMeta.filter(i=>!ids.has(i.id))]);
    }
  }
  toast('✅ 가져오기 완료');
  updateStats();
}

async function importImages(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const allowed = ['image/jpeg','image/png','image/gif','image/webp'];
  const metaArr = getData(KEYS.imgMeta);
  for (const file of files) {

    const id = genId('img');
    await idbPut({id, data: file, mimeType: file.type, createdAt: new Date().toISOString()});
    metaArr.push({
      id, title: file.name, category: '기타', date: today(),
      filename: file.name, mimeType: file.type, sizeBytes: file.size,
      tags: [], memo: '', createdAt: new Date().toISOString()
    });
  }
  saveData(KEYS.imgMeta, metaArr);
  input.value = '';
  toast(`✅ 이미지 ${files.length}개 가져오기 완료`);

  return m ? m[1] : null;

function openCTP(e, tabKey, id, btn) {
  e.stopPropagation();

  if (_ctpCtx && _ctpCtx.tabKey === tabKey && _ctpCtx.id === id && picker.classList.contains('open')) {

  _ctpCtx = {tabKey, id};

  const left = Math.min(rect.left, window.innerWidth - 240);
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
  document.getElementById('ctp-input').value = '';
  ctpRender('');
  picker.classList.add('open');

function ctpRender(filter) {
  if (!_ctpCtx) return;
  const {tabKey, id} = _ctpCtx;
  const allTags = getAllExistingTags();
  const arr = getData(KEYS[tabKey]);
  const item = arr.find(i=>i.id===id);
  const already = item ? (item.tags||[]) : [];
  const available = allTags.filter(t => !already.includes(t) && (filter ? t.toLowerCase().includes(filter.toLowerCase()) : true));
  const el = document.getElementById('ctp-chips');
  if (!available.length) {
    el.innerHTML = `<span class="ctp-empty">${filter ? '매칭 태그 없음' : '등록된 태그 없음 — 직접 입력 후 Enter'}</span>`;
  } else {
    el.innerHTML = available.slice(0,24).map(t =>
      `<span class="ctp-chip" onmousedown="ctpAdd(event,'${t.replace(/'/g,"\\'")}')">${t}</span>`
    ).join('');
  }
}

function ctpFilter() {
  ctpRender(document.getElementById('ctp-input').value);

function ctpKeydown(e) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  const val = e.target.value.trim().replace(/,/g,'');

  const {tabKey, id} = _ctpCtx;
  const arr = getData(KEYS[tabKey]);

/* ---- YouTube auto-analyze via Gemini ---- */
async function callGroqAPI(prompt, apiKey) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`},
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [{role: 'user', content: prompt}],
      max_tokens: 1024
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Groq API 오류 ${res.status}`);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || null;
}

async function autoAnalyzeYouTube(id) {
  const items = getData(KEYS.memo);
  const item = items.find(i => i.id === id);
  if (!item) return;

  const s = getSettings();
  if (!s.geminiApiKey && !s.groqApiKey) { copyMemoAnalysisPrompt(id); return; }

  const summaryEl = document.getElementById('detail-ai-summary');
  if (summaryEl) summaryEl.innerHTML = '<span style="color:var(--text-muted)">⏳ AI 분석 중...</span>';
  toast('YouTube 자동 분석 중...');

  try {
    let title = item.title, channel = '';
    try {
      const oe = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(item.url)}&format=json`);
      if (oe.ok) { const d = await oe.json(); title = d.title||title; channel = d.author_name||''; }
    } catch(e) {}

    const textPrompt = item.transcript
      ? buildTranscriptPrompt(item)
      : `다음 YouTube 영상을 분석해서 한국어로 요약해줘.\n\n제목: ${title}\n채널: ${channel}\nURL: ${item.url}\n${item.content ? '내 메모: '+item.content : ''}\n\n아래 형식으로 작성:\n## 핵심 요약\n(3~5줄)\n\n## 주요 인사이트\n• \n• \n• \n\n## 실용적 적용\n• \n\n## 핵심 키워드\n#키워드1 #키워드2 #키워드3`;

    let summary = null;

    // 1단계: Gemini 시도 (설정된 경우)
    if (s.geminiApiKey) {
      const BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
      for (const model of ['gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-flash-8b']) {
        const url = `${BASE}${model}:generateContent?key=${s.geminiApiKey}`;
        const r1 = await fetch(url, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({contents: [{parts: [
            {text: textPrompt},
            {fileData: {fileUri: item.url, mimeType: 'video/mp4'}}
          ]}]})
        }).catch(() => null);
        if (r1 && r1.ok) {
          const d = await r1.json();
          summary = d.candidates?.[0]?.content?.parts?.[0]?.text || null;
          if (summary) break;
        }
        const r2 = await fetch(url, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({contents: [{parts: [{text: textPrompt}]}]})
        }).catch(() => null);
        if (r2 && r2.ok) {
          const d2 = await r2.json();
          summary = d2.candidates?.[0]?.content?.parts?.[0]?.text || null;
          if (summary) break;
        }
      }
    }

    // 2단계: Groq fallback (Gemini 실패 또는 미설정)
    if (!summary && s.groqApiKey) {
      if (summaryEl) summaryEl.innerHTML = '<span style="color:var(--text-muted)">⏳ Groq(Llama) 분석 중...</span>';
      summary = await callGroqAPI(textPrompt, s.groqApiKey);
    }

    if (!summary) throw new Error('분석 응답을 받지 못했습니다');

    item.aiSummary = summary;
    saveData(KEYS.memo, items);
    renderDetail(id);
    toast('✅ 자동 분석 완료!');
  } catch(e) {
    const htmlMsg = e.message.replace(/\n/g, '<br>');
    if (summaryEl) summaryEl.innerHTML = `<span style="color:#EF4444">${htmlMsg}</span>`;
    toast('분석 실패: ' + e.message.split('\n')[0]);
  }
}

/* ============================================================
   QUICK SAVE — PARSER
   ============================================================ */
let parsedItems = [];

const TYPE_META = {
  'memo_유튜브링크': {label:'🎬 유튜브 링크', color:'#EF4444'},
  'memo_인스타링크': {label:'📸 인스타 링크', color:'#E1306C'},
  'memo_스레드링크': {label:'🧵 스레드 링크', color:'#7C4DBD'},
  'memo_기타링크':   {label:'🔗 기타 링크',   color:'#6366F1'},
  'memo_아이디어':   {label:'💡 아이디어',     color:'#F59E0B'},
  'memo_생각정리':   {label:'🧠 생각 정리',    color:'#0EA5E9'},
  'memo_메모':       {label:'📝 메모',          color:'#A0A0A0'},
  'viral':           {label:'📊 바이럴 글',     color:'#10B981'},
  'call':            {label:'📞 통화/미팅',     color:'#8B5CF6'},
};

function guessChannel(text, url) {
  const s = (url || '') + ' ' + (text || '');
  if (/x\.com|twitter\.com/.test(s)) return 'X';
  if (/threads\.net/.test(s)) return '스레드';
  if (/instagram\.com/.test(s)) return '인스타그램';
  if (/youtube\.com|youtu\.be/.test(s)) return '유튜브';
  return 'X';
}

/* ---- URL type detection ---- */
function guessUrlType(url) {
  if (/youtube\.com|youtu\.be/.test(url)) return 'memo_유튜브링크';
  if (/instagram\.com|instagr\.am/.test(url)) return 'memo_인스타링크';
  if (/threads\.net/.test(url)) return 'memo_스레드링크';
  if (/x\.com|twitter\.com/.test(url)) return 'viral';
  return 'memo_기타링크';
}

/* ---- Topic auto-detection ---- */
const TOPIC_RULES = [
  {k:['부동산','아파트','오피스텔','힐스테이트','힐','빌라','상가','임대차','취등록','양도세','pir','전세가','매매가'], v:'부동산'},
  {k:['송도'], v:'송도'},
  {k:['판교','강남','분당','수원','용인','광교','위례'], v:'지역'},
  {k:['주식','보로노이','삼성물산','삼성화재','현대엘베','특수개발','매수','매도','종목','포트폴리오'], v:'주식'},
  {k:['법인','세무','세금','사업자','인건비','급여','조종료','세무사'], v:'법인/세무'},
  {k:['제품','제조','원료','패키지','moq','수면r','수면','원가','생산','상페'], v:'제품'},
  {k:['aeo','geo','seo','마케팅','광고','바이럴','전환율','ctr','캠페인','콘텐츠'], v:'마케팅'},
  {k:['대출','금리','ltv','담보','신용','레버리지'], v:'대출/금융'},
  {k:['정부지원','지원사업','보조금','정책자금'], v:'정부지원'},
  {k:['전세','월세','임대','보증금','계약'], v:'임대차'},
  {k:['투자','roi','수익률','배당'], v:'투자'},
];

function detectTopics(text, url) {
  const s = ((text||'') + ' ' + (url||'')).toLowerCase();
  const found = [];
  for (const rule of TOPIC_RULES) {
    if (rule.k.some(k => s.includes(k.toLowerCase())) && !found.includes(rule.v)) {
      found.push(rule.v);
    }
  }
  return found.slice(0, 4);
}

/* ---- Text-only memo classifier ---- */
function classifyText(text) {
  const t = text.toLowerCase();
  if (/회의|미팅|통화|상담|참석|액션|결론|안건|다음 주|다음주|일정/.test(t)) return 'call';
  if (/조회수|좋아요|댓글수|팔로워|바이럴|훅|cta|광고비|전환율/.test(t)) return 'viral';
  if (/\d+억|\d+만원|\d+천만|수익률|roi|pir|대출|매출|비용|법인|투자|주식/.test(t)) return 'memo_생각정리';
  if (text.trim().split('\n').length <= 2 && text.length < 120) return 'memo_아이디어';
  if (text.trim().split('\n').length >= 4) return 'memo_생각정리';
  return 'memo_메모';
}

/* ---- Extract items from a single message's content ---- */
function extractItemsFromContent(content) {
  const urlRegex = /https?:\/\/[^\s\]]+/g;
  const urls = [...new Set(content.match(urlRegex) || [])];
  const textWithoutUrls = content.replace(urlRegex, '').replace(/\n{3,}/g, '\n\n').trim();
  const items = [];

  for (const url of urls) {
    const type = guessUrlType(url);
    // 제목: URL 다음에 오는 텍스트가 있으면 그걸 제목으로, 없으면 URL 도메인
    const contextText = textWithoutUrls.split('\n')[0].trim();
    const domain = url.replace(/https?:\/\//,'').split('/')[0];
    const title = contextText || domain;
    const shortTitle = title.length > 70 ? title.slice(0, 70) + '...' : title;
    const topics = detectTopics(content, url);
    items.push({ type, title: shortTitle, content: textWithoutUrls, url, topics });
  }

  // 텍스트 파트: URL의 단순 레이블(짧고 1~2줄)이면 별도 아이템 안 만듦
  if (textWithoutUrls) {
    const isShortLabel = urls.length > 0 && textWithoutUrls.split('\n').length <= 2 && textWithoutUrls.length < 80;
    if (!isShortLabel) {
      const type = classifyText(textWithoutUrls);
      const firstLine = textWithoutUrls.split('\n')[0].trim();
      const title = firstLine.length > 70 ? firstLine.slice(0, 70) + '...' : firstLine;
      const topics = detectTopics(textWithoutUrls, '');
      items.push({ type, title, content: textWithoutUrls, url: '', topics });
    }
  }

  return items;
}

/* ---- KakaoTalk format parser ---- */
function isKakaoFormat(text) {
  return /\[.+?\] \[(?:오전|오후) \d+:\d+\]/.test(text);
}

function parseKakaoMessages(text) {
  const lines = text.split('\n');
  const headerRe = /^\[(.+?)\] \[(?:오전|오후) \d+:\d+\] (.*)$/;
  const sectionRe = /^\[([^\]]+)\]$/; // 예: [정부지원사업]

  const messages = [];
  let cur = null;

  for (const line of lines) {
    const hm = headerRe.exec(line);
    if (hm) {
      if (cur) messages.push(cur);
      cur = { content: hm[2] };
      continue;
    }
    const sm = sectionRe.exec(line.trim());
    if (sm && !cur) {
      // standalone section header — treat as memo
      messages.push({ content: line.trim() });
      continue;
    }
    if (cur) {
      if (line.trim()) cur.content += '\n' + line;
    }
  }
  if (cur) messages.push(cur);
  return messages;
}

/* ---- Plain text parser (non-kakao) ---- */
function parsePlainText(text) {
  // Split by blank lines
  const blocks = text.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => ({ content: b }));
}

/* ---- Main analysis function ---- */
function analyzeQuickPaste() {
  const text = document.getElementById('quick-paste').value.trim();
  if (!text) { toast('내용을 붙여넣으세요'); return; }

  const messages = isKakaoFormat(text) ? parseKakaoMessages(text) : parsePlainText(text);

  parsedItems = [];
  for (const msg of messages) {
    if (!msg.content.trim()) continue;
    const extracted = extractItemsFromContent(msg.content.trim());
    parsedItems.push(...extracted);
  }

  // Deduplicate by url
  const seenUrls = new Set();
  parsedItems = parsedItems.filter(item => {
    if (!item.url) return true;
    if (seenUrls.has(item.url)) return false;
    seenUrls.add(item.url);
    return true;
  });

  renderParsedPreview();
  document.getElementById('parsed-preview').style.display = parsedItems.length ? 'block' : 'none';
  if (!parsedItems.length) toast('항목을 감지하지 못했습니다');
}

function renderParsedPreview() {
  const count = parsedItems.length;

    const chips = (item.topics||[]).map((t,ti) =>

    ).join('');

    return `
    <div class="parsed-item-card" id="pcard-${idx}">
      <div class="parsed-item-top">
        <select class="parsed-type-select" onchange="updateParsedType(${idx},this.value)">
          ${Object.entries(TYPE_META).map(([v,m])=>`<option value="${v}" ${v===item.type?'selected':''}>${m.label}</option>`).join('')}
        </select>
        <button class="parsed-item-remove" onclick="removeParsedItem(${idx})" title="삭제">✕</button>
      </div>
      <input class="parsed-title-input" value="${(item.title||'').replace(/"/g,'&quot;').replace(/'/g,"&#39;")}" placeholder="제목" oninput="updateParsedTitle(${idx},this.value)">
      <div class="topic-input-wrap">
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">주제:</span>
        ${chips}
        <input class="topic-add-input" placeholder="+ 주제 추가" onkeydown="addTopicOnEnter(event,${idx},this)">
      </div>
      ${item.url ? `<div style="margin-bottom:6px;overflow:hidden"><span class="parsed-url-tag" title="${item.url}">🔗 ${item.url}</span></div>` : ''}
      ${previewShort ? `<div class="parsed-content-preview">${previewShort}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('parsed-items-list').innerHTML = html ||
    '<div style="color:var(--text-muted);font-size:13px;padding:8px">감지된 항목이 없습니다</div>';
}

function updateParsedType(idx, val) {
  parsedItems[idx].type = val;
}
function updateParsedTitle(idx, val) {
  parsedItems[idx].title = val;
}
function removeParsedItem(idx) {
  parsedItems.splice(idx, 1);
  renderParsedPreview();
  document.getElementById('parsed-count').textContent = `${parsedItems.length}개 항목 감지됨`;
  if (!parsedItems.length) document.getElementById('parsed-preview').style.display = 'none';
}
function removeTopic(itemIdx, topicIdx) {
  parsedItems[itemIdx].topics.splice(topicIdx, 1);
  renderParsedPreview();
}
function addTopicOnEnter(e, idx, input) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = input.value.trim().replace(/,/g,'');
    if (val && !parsedItems[idx].topics.includes(val)) {
      parsedItems[idx].topics.push(val);
      renderParsedPreview();
    }
  }
}

/* ---- Save all parsed items ---- */
function saveAllParsedItems() {
  if (!parsedItems.length) { toast('저장할 항목이 없습니다'); return; }
  const now = today();

  const viralArr = getData(KEYS.viral);
  const memoArr  = getData(KEYS.memo);
  const callArr  = getData(KEYS.calls);

  let counts = {viral:0, memo:0, call:0};

  for (const item of parsedItems) {
    const title = (item.title || '(제목 없음)').trim();

    const tags = item.topics || [];

    if (item.type === 'viral') {
      viralArr.push({
        id: genId('v'), title,
        channel: guessChannel(item.content, item.url),
        type: '바이럴', category: tags[0] || '기타', author: '',
        originalDate: now, collectedAt: now,
        views: 0, likes: 0, comments: 0,
        url: item.url || '',
        aiSummary: '', tags,
        myMemo: item.content || '',
        isBest: false, isPublished: false, publishedAt: null
      });
      counts.viral++;

    } else if (item.type === 'call') {
      callArr.push({
        id: genId('c'), title,
        type: '기타', date: now, duration: 0, attendees: [],
        fullContent: item.content || '',
        aiSummary: '', actionItems: [], tags, myMemo: '',
        createdAt: now
      });
      counts.call++;

    } else {
      const memoType = item.type.replace('memo_', '') || '메모';
      memoArr.push({
        id: genId('m'), type: memoType, title,
        content: item.content || '',
        url: item.url || '',
        myThought: '', tags, aiSummary: '',
        savedAt: now
      });
      counts.memo++;
    }
  }

  saveData(KEYS.viral, viralArr);
  saveData(KEYS.memo, memoArr);
  saveData(KEYS.calls, callArr);

  const parts = [];
  if (counts.viral) parts.push(`바이럴 ${counts.viral}개`);
  if (counts.memo)  parts.push(`메모 ${counts.memo}개`);
  if (counts.call)  parts.push(`통화기록 ${counts.call}개`);
  toast(`✅ 저장 완료 — ${parts.join(', ')}`);

  quickClear();
}

function quickClear() {
  document.getElementById('quick-paste').value = '';
  document.getElementById('parsed-preview').style.display = 'none';
  parsedItems = [];
}

/* ============================================================
   SELECT MODE
   ============================================================ */
function toggleSelectMode() {
  selectMode = !selectMode;
  if (!selectMode) { exitSelectMode(); return; }
  selectedIds.clear();
  document.getElementById('select-bar').style.display = 'flex';
  const btn = document.getElementById('select-mode-btn');
  btn.textContent = '취소';
  btn.classList.replace('btn-secondary','btn-primary');
  document.getElementById('list-items').classList.add('select-mode');
  updateSelectBar();
  renderList();
}

function exitSelectMode() {
  if (!selectMode && selectedIds.size === 0) return;
  selectMode = false;
  selectedIds.clear();
  const bar = document.getElementById('select-bar');
  const btn = document.getElementById('select-mode-btn');
  const listEl = document.getElementById('list-items');
  if (bar) bar.style.display = 'none';
  if (btn) { btn.textContent = '선택'; btn.classList.replace('btn-primary','btn-secondary'); }
  if (listEl) listEl.classList.remove('select-mode');
}

function toggleSelectCard(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateSelectBar();
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) {
    card.classList.toggle('selected', selectedIds.has(id));
    const chk = card.querySelector('.card-check');
    if (chk) chk.style.background = selectedIds.has(id) ? 'var(--accent)' : '';
  }
}

function selectAll() {
  getFilteredItems().forEach(i => selectedIds.add(i.id));
  updateSelectBar();
  renderList();
}

function clearSelection() {
  selectedIds.clear();
  updateSelectBar();
  renderList();
}

function updateSelectBar() {
  const el = document.getElementById('select-count');
  if (el) el.textContent = `${selectedIds.size}개 선택됨`;
}

/* ============================================================
   MOVE MENU (단일 카드 이동)
   ============================================================ */
function isValidMove(fromTab, toTab) {
  const valid = {viral:['memo','calls'], memo:['viral','calls'], calls:['viral','memo']};
  return (valid[fromTab]||[]).includes(toTab);
}

function getMoveTargets(fromTab) {
  const labels = {viral:'📊 바이럴 아카이브', memo:'💬 메모함', calls:'📞 통화기록'};
  return ['viral','memo','calls'].filter(t => t !== fromTab && isValidMove(fromTab, t))
    .map(t => ({tab:t, label:`${labels[t]}으로 이동`}));
}

function showMoveMenu(e, fromTab, id) {
  closeMoveMenu();
  const menu = document.createElement('div');
  menu.className = 'move-menu';
  const rect = e.target.getBoundingClientRect();
  menu.style.left = `${Math.min(rect.left, window.innerWidth - 200)}px`;
  menu.style.top = `${Math.min(rect.bottom + 4, window.innerHeight - 370)}px`;

  const s = getSettings();
  const groups = {
    viral: [
      {label:'📊 바이럴 탭', types:['바이럴','판매글','레퍼런스']},
      {label:'💬 메모로 이동', types:(s.memoTypes||DEFAULT_SETTINGS.memoTypes)},
      {label:'📞 통화 탭', types:['통화','회의']},
    ],
    memo: [
      {label:'💬 메모 탭', types:(s.memoTypes||DEFAULT_SETTINGS.memoTypes)},
      {label:'📊 바이럴로 이동', types:['바이럴','판매글','레퍼런스']},
      {label:'📞 통화 탭', types:['통화','회의']},
    ],
    calls: [
      {label:'📞 통화 탭', types:['통화','회의']},
      {label:'📊 바이럴로 이동', types:['바이럴','판매글','레퍼런스']},
      {label:'💬 메모로 이동', types:(s.memoTypes||DEFAULT_SETTINGS.memoTypes)},
    ],
  };

  (groups[fromTab]||[]).forEach((group, gi) => {
    if (gi > 0) {
      const div = document.createElement('div');
      div.className = 'move-menu-divider';
      menu.appendChild(div);
    }
    const hdr = document.createElement('div');
    hdr.className = 'move-menu-header';
    hdr.textContent = group.label;
    menu.appendChild(hdr);
    group.types.forEach(type => {
      const el = document.createElement('div');
      el.className = 'move-menu-item';
      el.textContent = type;
      el.addEventListener('click', (ev) => { ev.stopPropagation(); closeMoveMenu(); changeType(fromTab, id, type); });
      el.addEventListener('touchend', (ev) => { ev.preventDefault(); ev.stopPropagation(); closeMoveMenu(); changeType(fromTab, id, type); });
      menu.appendChild(el);
    });
  });

  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMoveMenu, {once:true}), 0);
}

function showStatusMenu(e, tab, id) {
  closeMoveMenu();
  const menu = document.createElement('div');
  menu.className = 'move-menu';
  const rect = e.target.getBoundingClientRect();
  menu.style.left = `${Math.min(rect.left, window.innerWidth - 160)}px`;
  menu.style.top = `${rect.bottom + 4}px`;
  const LABELS = {'할일':'📌 할일','검토':'🔍 검토','보관':'📦 보관','읽음':'✅ 읽음'};
  ['할일','검토','보관','읽음'].forEach(s => {
    const el = document.createElement('div');
    el.className = 'move-menu-item';
    el.textContent = LABELS[s];
    el.addEventListener('click', (ev) => { ev.stopPropagation(); closeMoveMenu(); setStatus(tab, id, s); });
    el.addEventListener('touchend', (ev) => { ev.preventDefault(); ev.stopPropagation(); closeMoveMenu(); setStatus(tab, id, s); });
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMoveMenu, {once:true}), 0);
}

function onSettingsDragStart(e, listName, idx) {
  settingsDragSrc = {listName, idx};
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function onSettingsDragOver(e, listName, idx) {
  if (!settingsDragSrc || settingsDragSrc.listName !== listName) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.channel-item.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (settingsDragSrc.idx !== idx) e.currentTarget.classList.add('drag-over');
}

function onSettingsDrop(e, listName, idx) {
  e.preventDefault();
  if (!settingsDragSrc || settingsDragSrc.listName !== listName || settingsDragSrc.idx === idx) return;
  const s = getSettings();
  const arr = [...(s[listName] || [])];
  const [item] = arr.splice(settingsDragSrc.idx, 1);
  arr.splice(idx, 0, item);
  s[listName] = arr;
  saveSettings(s);
  settingsDragSrc = null;
  renderSettings();
  toast('순서가 변경되었습니다');
}

function onSettingsDragEnd(e) {
  document.querySelectorAll('.channel-item.dragging, .channel-item.drag-over').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
  settingsDragSrc = null;
}

function showBatchMoveMenu(e) {
  closeMoveMenu();
  if (selectedIds.size === 0) { toast('선택된 항목이 없습니다'); return; }
  const targets = getMoveTargets(currentTab);
  if (!targets.length) { toast('이동 가능한 탭이 없습니다'); return; }
  const menu = document.createElement('div');
  menu.className = 'move-menu';
  const rect = e.target.getBoundingClientRect();
  menu.style.left = `${Math.min(rect.left, window.innerWidth - 180)}px`;
  menu.style.top = `${rect.bottom + 4}px`;
  targets.forEach(({tab, label}) => {
    const item = document.createElement('div');
    item.className = 'move-menu-item';
    item.textContent = label;
    item.onclick = () => { closeMoveMenu(); batchMove(tab); };
    menu.appendChild(item);
  });
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMoveMenu, {once:true}), 0);
}

function closeMoveMenu() {
  document.querySelectorAll('.move-menu').forEach(m => m.remove());
}

/* ============================================================
   BATCH OPERATIONS
   ============================================================ */
function batchDelete() {
  if (selectedIds.size === 0) { toast('선택된 항목이 없습니다'); return; }
  showModal('삭제 확인', `선택된 ${selectedIds.size}개 항목을 삭제하시겠습니까?`, [
    {label:'취소', cls:'btn-secondary', action:'closeModal()'},
    {label:'삭제', cls:'btn-danger', action:'confirmBatchDelete()'}
  ]);
}

async function confirmBatchDelete() {
  closeModal();
  const ids = [...selectedIds];
  if (currentTab === 'images') {
    for (const id of ids) await idbDelete(id);
    saveData(KEYS.imgMeta, getData(KEYS.imgMeta).filter(i => !ids.includes(i.id)));
  } else {
    saveData(KEYS[currentTab], getData(KEYS[currentTab]).filter(i => !ids.includes(i.id)));
  }
  if (ids.includes(selectedId)) {
    selectedId = null;
    document.getElementById('detail-panel').classList.remove('visible');
    document.getElementById('no-detail').style.display = 'flex';
  }
  const count = ids.length;
  exitSelectMode();
  renderList();
  toast(`🗑 ${count}개 삭제됨`);
}

function batchMove(toTab) {
  const ids = [...selectedIds];
  if (!ids.length) return;
  const fromKey = KEYS[currentTab];
  const toKey = KEYS[toTab];
  const fromArr = getData(fromKey);
  const toArr = getData(toKey);
  let moved = 0;
  ids.forEach(id => {
    const idx = fromArr.findIndex(i => i.id === id);
    if (idx === -1) return;
    const src = fromArr[idx];
    const newItem = buildMovedItem(currentTab, toTab, src);
    if (!newItem) return;
    fromArr.splice(idx, 1);
    toArr.push(newItem);
    moved++;
  });
  saveData(fromKey, fromArr);
  saveData(toKey, toArr);
  const tabLabels = {viral:'바이럴', memo:'메모함', calls:'통화기록'};
  toast(`✅ ${moved}개 → ${tabLabels[toTab]||toTab} 이동 완료`);
  exitSelectMode();
  switchTab(toTab);
}

function buildMovedItem(fromTab, toTab, src) {
  if (fromTab === 'memo' && toTab === 'calls') return {id:genId('c'),title:src.title,type:'기타',date:src.savedAt||today(),duration:0,attendees:[],fullContent:src.content||'',aiSummary:src.aiSummary||'',actionItems:[],tags:src.tags||[],myMemo:src.myThought||'',createdAt:today()};
  if (fromTab === 'calls' && toTab === 'memo') return {id:genId('m'),type:'메모',title:src.title,content:src.fullContent||'',url:'',myThought:src.myMemo||'',tags:src.tags||[],aiSummary:src.aiSummary||'',savedAt:src.date||today()};
  if (fromTab === 'viral' && toTab === 'memo') return {id:genId('m'),type:'메모',title:src.title,content:src.content||'',url:src.url||'',myThought:'',tags:src.tags||[],aiSummary:src.aiSummary||'',savedAt:src.originalDate||today()};
  if (fromTab === 'viral' && toTab === 'calls') return {id:genId('c'),title:src.title,type:'기타',date:src.originalDate||today(),duration:0,attendees:[],fullContent:src.content||'',aiSummary:src.aiSummary||'',actionItems:[],tags:src.tags||[],myMemo:'',createdAt:today()};
  if (fromTab === 'memo' && toTab === 'viral') return {id:genId('v'),title:src.title,channel:'메모',type:'메모',category:'',author:'',originalDate:src.savedAt||today(),collectedAt:today(),views:0,likes:0,comments:0,content:src.content||'',url:src.url||'',aiSummary:src.aiSummary||'',tags:src.tags||[]};
  if (fromTab === 'calls' && toTab === 'viral') return {id:genId('v'),title:src.title,channel:'통화',type:'미팅',category:'',author:'',originalDate:src.date||today(),collectedAt:today(),views:0,likes:0,comments:0,content:src.fullContent||'',url:'',aiSummary:src.aiSummary||'',tags:src.tags||[]};
  return null;
}

/* ============================================================
   DRAG AND DROP (카드 → 탭 이동)
   ============================================================ */
function onCardDragStart(e, id) {
  dragItem = {tab: currentTab, id};
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => {
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
  document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
    const t = btn.dataset.tab;
    if (['viral','memo','calls'].includes(t) && t !== currentTab) btn.dataset.dropReady = '1';
  });
}

function onCardDragEnd(e) {
  const el = document.querySelector(`.card[data-id="${dragItem?.id}"]`);
  if (el) el.classList.remove('dragging');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('drag-over');
    delete btn.dataset.dropReady;
  });
  dragItem = null;
}

function setupTabDropTargets() {
  document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
    btn.addEventListener('dragover', e => {
      if (!dragItem || !btn.dataset.dropReady) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      btn.classList.add('drag-over');
    });
    btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));
    btn.addEventListener('drop', e => {
      e.preventDefault();
      btn.classList.remove('drag-over');
      if (!dragItem) return;
      const toTab = btn.dataset.tab;
      if (!isValidMove(dragItem.tab, toTab)) { toast('이 탭으로는 이동할 수 없습니다'); return; }
      const {tab: fromTab, id} = dragItem;
      dragItem = null;
      confirmMove(fromTab, id, toTab);
    });
  });
}

/* ============================================================
   START
   ============================================================ */
init();
</script>
