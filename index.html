<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>스마트 아카이브 v5</title>
<style>
:root {
  --bg-primary: #0F0F0F;
  --bg-secondary: #1A1A1A;
  --bg-card: #242424;
  --bg-sidebar: #161616;
  --border: #2E2E2E;
  --text-primary: #F0F0F0;
  --text-secondary: #A0A0A0;
  --text-muted: #606060;
  --accent: #6366F1;
  --accent-hover: #818CF8;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
}
[data-theme="light"] {
  --bg-primary: #F8F8F8;
  --bg-secondary: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-sidebar: #F0F0F0;
  --border: #E0E0E0;
  --text-primary: #111111;
  --text-secondary: #555555;
  --text-muted: #999999;
  --accent: #6366F1;
  --accent-hover: #4F46E5;
  --success: #059669;
  --warning: #D97706;
  --danger: #DC2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;font-size:14px;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}
input,textarea,select{font-family:inherit;outline:none;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--accent-hover);}
/* ===== LOGIN ===== */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary);}
.login-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center;}
.login-logo{font-size:28px;font-weight:700;color:var(--text-primary);margin-bottom:8px;}
.login-sub{color:var(--text-muted);font-size:13px;margin-bottom:32px;}
.login-input{width:100%;padding:12px 16px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:15px;margin-bottom:16px;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:8px;font-size:15px;font-weight:600;transition:background .2s;}
.login-btn:hover{background:var(--accent-hover);}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;display:none;}
/* ===== APP ===== */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden;}
/* TOPBAR */
.topbar{height:52px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;}
.topbar-logo{font-weight:700;font-size:16px;color:var(--text-primary);}
.topbar-stats{font-size:12px;color:var(--text-muted);flex:1;}
.topbar-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 10px;border-radius:6px;font-size:12px;transition:all .2s;}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);}
/* TAB NAV */
.tabnav{height:46px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:2px;flex-shrink:0;overflow-x:auto;}
.tabnav::-webkit-scrollbar{display:none;}
.tab-btn{padding:8px 14px;border-radius:6px;color:var(--text-muted);font-size:13px;font-weight:500;white-space:nowrap;background:transparent;transition:all .2s;cursor:grab;user-select:none;}
.tab-btn:active{cursor:grabbing;}
.tab-btn:hover{color:var(--text-primary);background:var(--bg-card);}
.tab-btn.active{color:var(--accent);background:var(--bg-card);}
.tab-btn.dragging{opacity:.4;}
.tab-btn.tab-reorder-over{outline:2px dashed var(--accent);outline-offset:-2px;}
/* MAIN LAYOUT */
.main-area{display:flex;flex:1;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:200px;background:var(--bg-sidebar);border-right:1px solid var(--border);padding:12px;overflow-y:auto;flex-shrink:0;}
.sidebar-section{margin-bottom:20px;}
.sidebar-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-left:4px;}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:all .15s;}
.sidebar-item:hover{background:var(--bg-card);color:var(--text-primary);}
.sidebar-item.active{background:var(--accent);color:#fff;}
.sidebar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* LIST PANEL */
.list-panel{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.list-header{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input{width:100%;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;}
.search-input:focus{border-color:var(--accent);}
.tag-strip{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);}
.tag-chip{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.tag-chip:hover,.tag-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.list-items{flex:1;overflow-y:auto;padding:8px;}
.card{position:relative;padding:12px;padding-right:30px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .15s;}
.card:hover{border-color:var(--accent);}
.card.active{border-color:var(--accent);background:var(--bg-secondary);}
.card-del{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:transparent;border:none;color:var(--text-muted);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;transition:opacity .15s,background .15s;}
.card:hover .card-del{opacity:1;}
.card-del:hover{background:var(--danger);color:#fff;}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.card-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4;}
.card-meta{font-size:11px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;}
.card-stats{font-size:11px;color:var(--text-secondary);margin-top:4px;}
/* SELECT MODE */
.card-check{position:absolute;top:9px;left:9px;width:16px;height:16px;border-radius:3px;border:1.5px solid var(--border);background:var(--bg-card);display:none;align-items:center;justify-content:center;font-size:10px;z-index:1;transition:all .15s;pointer-events:none;}
.select-mode .card-check{display:flex;}
.select-mode .card{padding-left:34px;}
.select-mode .card-del{display:none!important;}
.card.selected .card-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.card.selected{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(99,102,241,.2);}
.select-bar{display:flex;align-items:center;gap:5px;padding:7px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;}
.select-count{font-size:11px;color:var(--text-muted);flex:1;white-space:nowrap;overflow:hidden;}
/* CARD MOVE BUTTON */
.card-actions{display:flex;justify-content:flex-end;margin-top:6px;opacity:0;transition:opacity .15s;}
.card:hover .card-actions{opacity:1;}
.card-move-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:3px 9px;border-radius:4px;cursor:pointer;transition:all .15s;line-height:1.3;}
.card-move-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.select-mode .card-actions{display:none;}
/* MOVE MENU POPOVER */
.move-menu{position:fixed;z-index:9999;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:4px;min-width:170px;max-height:360px;overflow-y:auto;}
.move-menu-item{padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-primary);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.move-menu-item:hover{background:var(--bg-secondary);}
.move-menu-item:active{background:var(--accent);color:#fff;}
.move-menu-header{padding:6px 12px 2px;font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.move-menu-divider{height:1px;background:var(--border);margin:3px 4px;}
/* DRAG STATE */
.card.dragging{opacity:.4;transform:scale(.97);}
.tab-btn.drag-over{background:var(--accent)!important;color:#fff!important;outline:2px solid var(--accent);}
/* SETTINGS DRAG */
.channel-item[draggable]{cursor:grab;user-select:none;}
.channel-item[draggable]:active{cursor:grabbing;}
.channel-item[draggable] *{pointer-events:none;}
.channel-item[draggable] .mini-btn{pointer-events:auto;}
.channel-item.dragging{opacity:.4;}
.channel-item.drag-over{border:2px dashed var(--accent)!important;background:rgba(99,102,241,.08)!important;}
.drag-handle{color:var(--text-muted);margin-right:6px;font-size:15px;flex-shrink:0;}
/* EDITABLE TITLE / CONTENT */
.editable-title{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text-primary);font-size:20px;font-weight:700;line-height:1.3;padding:3px 6px;margin-bottom:8px;outline:none;font-family:inherit;box-sizing:border-box;transition:border-color .15s,background .15s;display:block;}
.editable-title:hover{border-color:var(--border);}
.editable-title:focus{border-color:var(--accent);background:var(--bg-card);}
.editable-content-area{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;line-height:1.7;padding:10px 12px;outline:none;resize:vertical;min-height:120px;font-family:inherit;box-sizing:border-box;margin-top:6px;}
.editable-content-area:focus{border-color:var(--accent);}
.edit-toggle-btn{font-size:11px;color:var(--text-muted);background:none;border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;margin-left:auto;transition:all .15s;}
.edit-toggle-btn:hover{color:var(--accent);border-color:var(--accent);}
/* DETAIL PANEL */
.detail-panel{flex:1;overflow-y:auto;padding:20px;display:none;}
.detail-panel.visible{display:block;}
.detail-title{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:12px;line-height:1.3;}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.detail-stats{display:flex;gap:16px;margin-bottom:16px;}
.stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;flex:1;}
.stat-num{font-size:18px;font-weight:700;color:var(--text-primary);}
.stat-label{font-size:11px;color:var(--text-muted);}
.detail-section{margin-bottom:20px;}
.detail-section-title{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.detail-text{font-size:14px;color:var(--text-secondary);line-height:1.7;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;}
.detail-tag{padding:4px 12px;border-radius:20px;font-size:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);}
.memo-input{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:13px;resize:vertical;min-height:80px;}
.memo-input:focus{border-color:var(--accent);}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-warning{background:var(--warning);color:#fff;}
/* ADD FORM */
.form-area{flex:1;overflow-y:auto;padding:24px;max-width:700px;}
.form-title{font-size:20px;font-weight:700;margin-bottom:20px;}
.form-type-select{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.form-type-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .2s;}
.form-type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;}
.form-input{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-textarea{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;resize:vertical;min-height:120px;}
.form-textarea:focus{border-color:var(--accent);}
select.form-input{appearance:none;}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-muted);font-size:14px;}
.dropzone:hover,.dropzone.drag-over{border-color:var(--accent);color:var(--accent);}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
.preview-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;}
.preview-item img{width:100%;height:100%;object-fit:cover;}
.preview-remove{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
/* SETTINGS */
.settings-area{flex:1;overflow-y:auto;padding:24px;max-width:700px;}
.settings-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.settings-section-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text-primary);}
.channel-item,.category-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.channel-item:last-child,.category-item:last-child{border-bottom:none;}
.channel-color{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.channel-name{flex:1;font-size:13px;color:var(--text-primary);}
.channel-actions{display:flex;gap:6px;}
.mini-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.mini-btn.del:hover{border-color:var(--danger);color:var(--danger);}
/* IMG THUMBS IN LIST */
.img-thumb{width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:6px;}
/* LIGHTBOX */
#lightbox{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;}
#lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;line-height:1;}
/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--text-primary);z-index:9998;transition:transform .3s;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:24px;width:420px;max-width:90vw;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
/* NO DETAIL */
.no-detail{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted);font-size:14px;}
/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
  .sidebar.open{display:block;position:fixed;top:0;left:0;width:240px;height:100vh;z-index:500;border-right:1px solid var(--border);}
  .hamburger{display:flex!important;}
  .list-panel{width:100%;}
  .detail-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:400;background:var(--bg-primary);padding:16px;overflow-y:auto;}
  .detail-close-btn{display:flex!important;}
  .form-row{grid-template-columns:1fr;}
}
.hamburger{display:none;background:none;color:var(--text-primary);font-size:18px;padding:4px 8px;}
.detail-close-btn{display:none;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;color:var(--text-secondary);font-size:13px;border:none;background:none;}
/* USAGE BAR */
.usage-bar{background:var(--bg-primary);border-radius:4px;height:6px;margin-top:6px;overflow:hidden;}
.usage-fill{background:var(--accent);height:100%;border-radius:4px;transition:width .3s;}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
/* BEST BADGE */
.best-badge{background:#F59E0B;color:#000;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.5px;}
/* COLOR PICKER */
.color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;transition:border .15s;}
.color-opt.selected,.color-opt:hover{border-color:var(--text-primary);}
/* IMPORT MERGE BTNS */
.merge-row{display:flex;gap:8px;margin-top:8px;}
/* QUICK SAVE */
.quick-save-box{background:var(--bg-card);border:2px solid var(--accent);border-radius:14px;padding:20px;margin-bottom:24px;}
.quick-save-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.quick-save-title{font-size:16px;font-weight:700;color:var(--text-primary);}
.quick-save-desc{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.6;}
.quick-paste-area{width:100%;min-height:160px;padding:14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:13px;resize:vertical;line-height:1.7;transition:border .2s;font-family:inherit;}
.quick-paste-area:focus{border-color:var(--accent);}
.quick-save-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.form-divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--text-muted);font-size:12px;}
.form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:var(--border);}
/* PARSED PREVIEW */
.parsed-preview{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.parsed-preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.parsed-count{font-size:13px;font-weight:700;color:var(--text-primary);}
.parsed-item-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;transition:border .15s;}
.parsed-item-card:hover{border-color:var(--accent);}
.parsed-item-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.parsed-type-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.parsed-item-remove{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;}
.parsed-item-remove:hover{color:var(--danger);}
.parsed-title-input{width:100%;padding:7px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;margin-bottom:6px;}
.parsed-title-input:focus{border-color:var(--accent);outline:none;}
.parsed-content-preview{font-size:12px;color:var(--text-muted);background:var(--bg-primary);border-radius:6px;padding:8px 10px;line-height:1.6;max-height:80px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
.parsed-type-select{font-size:12px;padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);}
.parsed-url-tag{font-size:11px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;display:inline-block;vertical-align:middle;}
.topic-input-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.topic-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent);color:#fff;}
.topic-chip-del{cursor:pointer;font-size:12px;line-height:1;opacity:.8;}
.topic-chip-del:hover{opacity:1;}
.topic-add-input{font-size:12px;padding:3px 8px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text-secondary);width:100px;}
.topic-add-input:focus{outline:none;border-color:var(--accent);color:var(--text-primary);}
/* CARD INLINE TAGS */
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;align-items:center;min-height:22px;}
.card-tag-chip{padding:2px 6px;border-radius:12px;font-size:11px;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:all .15s;line-height:1.4;}
.card-tag-chip:hover{background:#EF444420;border-color:#EF4444;color:#EF4444;}
.card-tag-chip .del{font-size:12px;line-height:1;opacity:.7;}
.card-tag-add{padding:2px 8px;border-radius:12px;font-size:11px;background:transparent;border:1px dashed var(--border);color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:all .15s;line-height:1.6;}
.card-tag-add:hover{border-color:var(--accent);color:var(--accent);}
/* FLOATING TAG PICKER */
#card-tag-picker{position:fixed;z-index:600;background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;padding:10px;width:230px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:none;}
#card-tag-picker.open{display:block;}
.ctp-input{width:100%;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12px;margin-bottom:8px;}
.ctp-input:focus{border-color:var(--accent);outline:none;}
.ctp-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.ctp-chips{display:flex;gap:5px;flex-wrap:wrap;max-height:110px;overflow-y:auto;}
.ctp-chip{padding:3px 10px;border-radius:16px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.ctp-chip:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.ctp-empty{font-size:11px;color:var(--text-muted);padding:4px 0;}
/* TAG SUGGEST */
.tag-suggest-wrap{position:relative;}
.tag-suggest-dropdown{position:absolute;top:100%;left:0;right:0;z-index:300;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;max-height:150px;overflow-y:auto;margin-top:4px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.tag-suggest-dropdown.open{display:block;}
.tag-suggest-item{padding:7px 12px;font-size:12px;cursor:pointer;color:var(--text-secondary);}
.tag-suggest-item:hover,.tag-suggest-item.sel{background:var(--accent);color:#fff;}
.tag-existing-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag-existing-chip{padding:3px 10px;border-radius:20px;font-size:11px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .15s;user-select:none;}
.tag-existing-chip:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
/* detail view inline tag suggest */
.detail-tag-wrap{position:relative;display:inline-block;}
.detail-tag-dropdown{position:absolute;top:100%;left:0;z-index:300;min-width:140px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;max-height:140px;overflow-y:auto;margin-top:4px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.detail-tag-dropdown.open{display:block;}
.detail-tag-dropdown .tag-suggest-item{padding:6px 12px;}
/* ===== TRANSCRIPT VIEWER ===== */
.transcript-section{border-left:3px solid #7C3AED30;padding-left:12px;}
.transcript-toggle-header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:4px 0;}
.transcript-toggle-header:hover .transcript-toggle-title{color:var(--text-primary);}
.transcript-toggle-title{font-size:13px;font-weight:600;color:var(--text-secondary);}
.transcript-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.transcript-badge.has{background:#7C3AED20;color:#A78BFA;}
.transcript-badge.empty{background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border);}
.transcript-badge.failed{background:#EF444420;color:#EF4444;border:1px solid #EF444430;}
.transcript-toggle-arrow{margin-left:auto;font-size:11px;color:var(--text-muted);}
.transcript-howto{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;line-height:2;color:var(--text-secondary);margin-bottom:12px;}
.transcript-howto code{background:var(--bg-primary);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;color:#A78BFA;display:inline-block;margin:1px 0;}
.transcript-paste{width:100%;min-height:90px;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);font-size:11px;font-family:monospace;resize:vertical;margin-bottom:8px;}
.transcript-paste:focus{border-color:#7C3AED;outline:none;}
.transcript-viewer{margin-top:10px;}
.transcript-highlights-panel{background:linear-gradient(135deg,#7C3AED12,#6366F108);border:1px solid #7C3AED25;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.transcript-panel-title{font-size:12px;font-weight:700;color:#A78BFA;margin-bottom:8px;letter-spacing:.3px;}
.transcript-hl-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #7C3AED10;}
.transcript-hl-item:last-child{border-bottom:none;}
.transcript-ts{flex-shrink:0;font-size:10px;background:#7C3AED20;color:#A78BFA;padding:2px 6px;border-radius:4px;font-family:monospace;margin-top:2px;white-space:nowrap;}
.transcript-hl-text{font-size:12px;color:var(--text-primary);line-height:1.65;}
.transcript-full-toggle{margin-top:6px;}
.transcript-full-toggle summary{font-size:12px;color:var(--text-muted);cursor:pointer;padding:5px 0;list-style:none;display:flex;align-items:center;gap:5px;}
.transcript-full-toggle summary::-webkit-details-marker{display:none;}
.transcript-full-toggle summary::before{content:'▶';font-size:10px;}
.transcript-full-toggle[open] summary::before{content:'▼';}
.transcript-full-body{margin-top:8px;max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;}
.ts-seg{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:4px;font-size:12px;line-height:1.65;color:var(--text-secondary);}
.ts-seg.hl{background:#7C3AED10;border-left:2px solid #7C3AED60;color:var(--text-primary);font-weight:500;}
.ts-seg .transcript-ts{background:var(--bg-secondary);color:var(--text-muted);}
.ts-seg.hl .transcript-ts{background:#7C3AED20;color:#A78BFA;}
</style>
</head>
<body>

<!-- FLOATING CARD TAG PICKER -->
<div id="card-tag-picker">
  <input class="ctp-input" id="ctp-input" placeholder="태그 검색 또는 입력 후 Enter"
    oninput="ctpFilter()" onkeydown="ctpKeydown(event)">

<!-- APP -->

  <!-- MAIN AREA -->

    <!-- SIDEBAR -->

    </div>
    <!-- LIST + DETAIL (viral/memo/calls/images) -->

      <div class="list-header">
        <div style="display:flex;gap:6px;align-items:center;">
          <input class="search-input" id="search-input" type="text" placeholder="🔍 검색..." oninput="onSearch()">
          <button class="btn btn-secondary" id="select-mode-btn" style="white-space:nowrap;font-size:12px;padding:6px 10px;flex-shrink:0" onclick="toggleSelectMode()">선택</button>
        </div>
      </div>

<script>
/* ============================================================
   CONSTANTS & STORAGE KEYS
   ============================================================ */
const APP_VERSION = '20260707-v5.2';

const PLATFORM_LABELS = {instagram:'인스타그램',youtube:'유튜브',tiktok:'틱톡',threads:'스레드',x:'X',web:'웹'};
function platLabel(p){ return PLATFORM_LABELS[p]||p||''; }

const KEYS = {
  viral: 'sa_viral',
  memo: 'sa_memo',
  calls: 'sa_calls',
  imgMeta: 'sa_img_meta',
  settings: 'sa_settings',
  password: 'sa_password',
  theme: 'sa_theme'
};

const DEFAULT_PW_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // "1234"

const DEFAULT_SETTINGS = {
  channels: [
    {name:'유튜브',color:'#FF0000',active:true},
    {name:'스레드',color:'#7C4DBD',active:true},
    {name:'X',color:'#E0E0E0',active:true},
    {name:'인스타그램',color:'#E1306C',active:true}
  ],
  categories: [
    {name:'퍼스널브랜딩',color:'#0EA5E9'},
    {name:'스레드 글 작성',color:'#10B981'},
    {name:'카피라이팅',color:'#F59E0B'},
    {name:'제품리뷰',color:'#EF4444'},
    {name:'기타',color:'#6366F1'}
  ],
  callTypes: ['미팅','상담','브레인스토밍','업무협의','기타'],
  imageCategories: ['레퍼런스','콘텐츠아이디어','디자인','스크린샷','기타'],
  memoTypes: ['유튜브링크','인스타링크','스레드링크','틱톡링크','아이디어','생각정리','기타링크','메모','업무'],
  tabOrder: ['memo','viral','calls','images','add','settings'],
  geminiApiKey: '',
  groqApiKey: '',
  autoGithubSync: false,
  scheduledSync: true
};

/* ============================================================
   STATE
   ============================================================ */
let currentTab = 'memo';
let tabDragSrc = null;
const TAB_DEFS = {
  memo:     {icon:'💬', label:'나의 메모함'},
  viral:    {icon:'📊', label:'바이럴 아카이브'},
  calls:    {icon:'📞', label:'통화 기록'},
  images:   {icon:'🖼', label:'이미지 보관함'},
  add:      {icon:'➕', label:'새로 추가'},
  settings: {icon:'⚙️', label:'설정'}
};
let currentFilter = {type:'전체', channel:'전체', category:'전체', status:'전체', tags:[], search:'', dateFrom:'', dateTo:'', rating:0};
let currentSort = 'desc'; // 'desc' = 최신순, 'asc' = 오래된순
let selectedId = null;
let formType = 'viral';
let addImageFiles = [];
let idb = null;
let groupedViewItems = [];
let selectMode = false;
let selectedIds = new Set();
let dragItem = null;
let settingsDragSrc = null;
let _autoBackupTimer = null;

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  idb = await openIDB();
  checkTheme();
  renderTabNav();
  checkAuth();
  document.addEventListener('click', e => {
    const picker = document.getElementById('card-tag-picker');
    if (picker && !picker.contains(e.target)) closeCTP();
  });
}

/* ============================================================
   SHA-256
   ============================================================ */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   UPDATE CHECK
   ============================================================ */
async function checkForUpdates() {
  try {
    const r = await fetch(location.pathname + '?_cv=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const html = await r.text();
    const m = html.match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) showUpdateBanner();
  } catch(e) {}
}

function showUpdateBanner() {
  if (document.getElementById('update-banner')) return;
  const el = document.createElement('div');
  el.id = 'update-banner';
  el.style.cssText = 'position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#6366F1;color:#fff;padding:10px 16px;border-radius:10px;z-index:9999;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap;';
  el.innerHTML = `<span>🔄 새 버전이 배포됐습니다</span><button onclick="location.reload(true)" style="background:#fff;color:#6366F1;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer">지금 업데이트</button><button onclick="this.parentNode.remove()" style="background:transparent;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;line-height:1">×</button>`;
  document.body.appendChild(el);
}

/* ============================================================
   AUTH
   ============================================================ */
let _remotePwHash = null;
const _configFetch = fetch('data/config.json?v=' + Date.now(), {cache:'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(cfg => { if (cfg && cfg.pwHash) _remotePwHash = cfg.pwHash; })
  .catch(() => {});

function checkAuth() {
  const auth = sessionStorage.getItem('sa_auth');
  if (auth === '1') showApp();
}

async function doLogin() {
  await _configFetch;
  const pw = document.getElementById('pw-input').value.trim();
  const hash = await sha256(pw);
  const stored = _remotePwHash || lsGet(KEYS.password) || DEFAULT_PW_HASH;
  if (hash === stored) {
    sessionStorage.setItem('sa_auth','1');
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  sessionStorage.removeItem('sa_auth');
  location.reload();
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  switchTab(currentTab);
  updateStats();
  setTimeout(autoImportFromServer, 1200);
  setTimeout(fetchArchive, 1500);
  setTimeout(applyTranscriptPatches, 2000);
  setTimeout(checkForUpdates, 3000);
  setInterval(checkForUpdates, 5 * 60 * 1000);
  setInterval(applyTranscriptPatches, 5 * 60 * 1000);
  startScheduledSync();
}

/* ── 번역 ── */
function needsTranslation(text) {
  if (!text || text.length < 15) return false;
  const sample = text.slice(0, 300);
  const nonAscii = (sample.match(/[^\x20-\x7E\n\r\t]/g) || []).length;
  return nonAscii / sample.length < 0.15;
}

async function translateText(text) {
  const cached = sessionStorage.getItem('tr_' + text.slice(0,40));
  if (cached) return cached;
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    const data = await res.json();
    const result = data[0].map(c => c[0]).filter(Boolean).join('');
    sessionStorage.setItem('tr_' + text.slice(0,40), result);
    return result;
  } catch(e) { return null; }
}

function toggleOriginal(id) {
  const el  = document.getElementById('orig-' + id);
  const btn = document.getElementById('orig-btn-' + id);
  if (!el) return;
  const hidden = el.style.display === 'none';
  el.style.display = hidden ? 'block' : 'none';

async function autoImportFromServer() {
  try {
    const res = await fetch('./imports/latest.json?t=' + Date.now());
    if (!res.ok) return;
    const json = await res.json();
    if (!json.data || !json.exportedAt) return;

    const lastImport = localStorage.getItem('sa_last_auto_import');
    if (lastImport === json.exportedAt) return; // 이미 이 버전 적용됨

    let added = 0;
    if (json.data.viral && json.data.viral.length > 0) {
      const existing = getData(KEYS.viral);
      const existingUrls = new Set(existing.map(i => i.url).filter(Boolean));
      const newItems = json.data.viral.filter(i => i.url && !existingUrls.has(i.url));
      if (newItems.length > 0) {
        saveData(KEYS.viral, [...newItems, ...existing]);
        added = newItems.length;
      }
    }

    localStorage.setItem('sa_last_auto_import', json.exportedAt);
    if (added > 0) {
      updateStats();
      renderList();
      toast('🔄 수집 결과 ' + added + '개 자동 추가됨');
    }
  } catch(e) { /* 파일 없으면 무시 */ }
}

function manualImportFromServer() {
  localStorage.removeItem('sa_last_auto_import');
  autoImportFromServer().then(() => {});
}

/* ============================================================
   ARCHIVE.JSON FETCH (v5 schema → app format)
   data/archive.json: Claude 스킬이 채우는 v5 형식 단일 소스
   ============================================================ */
async function fetchArchive() {
  try {
    const res = await fetch('./data/archive.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) return;
    const v5items = await res.json();
    if (!Array.isArray(v5items) || !v5items.length) return;

    const versionKey = (v5items[0].id || '') + (v5items[0].date || '') + v5items.length;
    if (localStorage.getItem('sa_last_archive_fetch') === versionKey) return;

    const buckets = {viral:[], memo:[], calls:[]};
    const existing = {
      viral: getData(KEYS.viral),
      memo:  getData(KEYS.memo),
      calls: getData(KEYS.calls),
    };
    const existingIds = {
      viral: new Set(existing.viral.map(i=>i.id).filter(Boolean)),
      memo:  new Set(existing.memo.map(i=>i.id).filter(Boolean)),
      calls: new Set(existing.calls.map(i=>i.id).filter(Boolean)),
    };
    const existingUrls = {
      viral: new Set(existing.viral.map(i=>i.url).filter(Boolean)),
      memo:  new Set(existing.memo.map(i=>i.url).filter(Boolean)),
    };

    for (const v5 of v5items) {
      const bucket = getAppKey(v5.type);
      if (!bucket) continue;
      if (v5.id  && existingIds[bucket] && existingIds[bucket].has(v5.id))  continue;
      if (v5.url && existingUrls[bucket] && existingUrls[bucket].has(v5.url)) continue;
      buckets[bucket].push(v5ToAppFormat(v5));
    }

    let added = 0;
    if (buckets.viral.length)  { saveData(KEYS.viral, [...buckets.viral,  ...existing.viral]);  added += buckets.viral.length; }
    if (buckets.memo.length)   { saveData(KEYS.memo,  [...buckets.memo,   ...existing.memo]);   added += buckets.memo.length; }
    if (buckets.calls.length)  { saveData(KEYS.calls, [...buckets.calls,  ...existing.calls]);  added += buckets.calls.length; }

    localStorage.setItem('sa_last_archive_fetch', versionKey);
    if (added > 0) { updateStats(); renderList(); toast('📦 아카이브 ' + added + '개 동기화됨'); }
  } catch(e) { /* data/archive.json 없으면 무시 */ }
}

function manualFetchArchive() {
  localStorage.removeItem('sa_last_archive_fetch');
  fetchArchive().then(() => {});
}

function v5ToAppFormat(v5) {
  return {
    ...v5,
    // v5→v4 호환 브리지 (렌더링 코드가 v4 필드명 사용)
    channel:     v5.platform   || v5.channel     || '',
    aiSummary:   v5.summary    || v5.aiSummary    || '',
    collectedAt: v5.date       || v5.collectedAt  || '',
    myMemo:      v5.memo       || v5.myMemo       || '',
    content:     v5.raw        || v5.content      || '',
    // memo 전용
    type:        v5.subtype    || v5.type         || '',
    savedAt:     v5.date       || v5.savedAt      || '',
    myThought:   v5.memo       || v5.myThought    || '',
    // calls 전용
    createdAt:   v5.date       || v5.createdAt    || '',
    fullContent: v5.fullContent || v5.raw         || '',
  };
}

function getAppKey(v5type) {
  if (['바이럴','판매글','레퍼런스'].includes(v5type)) return 'viral';
  if (['통화','회의'].includes(v5type)) return 'calls';
  if (['이미지'].includes(v5type)) return null;  // IndexedDB 처리
  // 메모, 업무 + 커스텀 memoTypes (유튜브링크, 틱톡링크 등) → memo
  if (v5type) return 'memo';
  return null;
}

function changeType(fromTab, id, newType) {
  if (!newType) return;
  const TAB_FOR = t => ['바이럴','판매글','레퍼런스'].includes(t) ? 'viral' :
                       ['통화','회의'].includes(t) ? 'calls' : 'memo';
  const toTab = TAB_FOR(newType);
  const fromKey = KEYS[fromTab];
  const toKey   = KEYS[toTab];
  const fromArr = getData(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if (idx === -1) { toast('⚠️ 항목을 찾을 수 없습니다 (id:' + id + ')'); return; }
  const item = {...fromArr[idx], type: newType};
  if (fromKey === toKey) {
    // 같은 탭 내 타입 변경: 맨 위로 이동 (splice + push → .reverse() 후 최상단)
    fromArr.splice(idx, 1);
    fromArr.push(item);
    saveData(fromKey, fromArr);
    selectedId = id;  // renderList 전에 설정해야 active 클래스 반영
    renderList();
    renderSidebar();
    renderDetail(id);
  } else {
    // 다른 탭으로 이동: 목적 탭 최상단에 표시 (배열 끝 추가 → .reverse() 후 최상단)
    fromArr.splice(idx, 1);
    saveData(fromKey, fromArr);
    const toArr = getData(toKey);
    saveData(toKey, [...toArr, item]);
    selectedId = null;
    switchTab(toTab);
  }
  const tabLabel = {viral:'바이럴 탭', memo:'메모 탭', calls:'통화 탭'}[toTab] || toTab;
  toast(`✅ "${newType}"(으)로 이동 → ${tabLabel}`);
}

function savePlatform(id, val) {
  saveField('viral', id, 'channel', val);
  saveField('viral', id, 'platform', val);
  renderSidebar();
}

function setStatus(tab, id, value) {
  saveField(tab, id, 'status', value);
  renderList();
  renderSidebar();
}

/* ============================================================
   TRANSCRIPT PATCH AUTO-IMPORT
   imports/transcripts.json → memo 항목에 전문/요약 자동 적용
   ============================================================ */
async function applyTranscriptPatches(force) {
  try {
    const res = await fetch('./imports/transcripts.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) return;
    const json = await res.json();
    if (!json.patches || !json.exportedAt) return;

    const lastApplied = localStorage.getItem('sa_last_transcript_import');
    if (!force && lastApplied === json.exportedAt) return;

    const arr = getData(KEYS.memo);
    let updated = 0;
    for (const patch of json.patches) {
      if (!patch.url && !patch.videoId) continue;
      // 1) 정확한 URL 매칭
      let item = patch.url ? arr.find(i => i.url === patch.url) : null;
      // 2) video ID 기반 매칭 (URL 형식 차이 fallback)
      if (!item) {
        const pVid = patch.videoId || extractYouTubeId(patch.url || '');
        if (pVid) item = arr.find(i => extractYouTubeId(i.url || '') === pVid);
      }
      if (!item) continue;
      let changed = false;
      // 전문은 항상 최신 값으로 덮어씀
      if (patch.transcript) { item.transcript = patch.transcript; changed = true; }
      // AI 요약: 없을 때만 채우거나 force 플래그 있을 때 덮어씀
      if (patch.aiSummary && (!item.aiSummary || patch.force)) { item.aiSummary = patch.aiSummary; changed = true; }
      // 상태 항상 업데이트
      if (patch.status) { item.transcriptStatus = patch.status; changed = true; }
      if (changed) updated++;
    }

    // 타임스탬프는 실제 적용 성공 후 저장 (0개 매칭 시 다음 로드에서 재시도)
    if (updated > 0) {
      saveData(KEYS.memo, arr);
      localStorage.setItem('sa_last_transcript_import', json.exportedAt);
      renderList();
      if (currentTab === 'memo' && selectedId) selectItem(selectedId);
      toast('📄 전문 분석 ' + updated + '개 자동 적용됨');
    } else {
      // 패치는 있지만 매칭 항목 없을 때 → 무한루프 방지용 저장
      if (json.patches.length > 0) localStorage.setItem('sa_last_transcript_import', json.exportedAt);
    }
  } catch(e) { console.warn('[transcript patch]', e); }
}

function manualApplyTranscripts() {
  localStorage.removeItem('sa_last_transcript_import');
  applyTranscriptPatches(true).then(() => {});
}

/* ============================================================
   LOCALSTORAGE HELPERS
   ============================================================ */
function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function getData(key) { return lsGet(key) || []; }
function getSettings() {
  const s = lsGet(KEYS.settings) || DEFAULT_SETTINGS;
  const defTypes = DEFAULT_SETTINGS.memoTypes;
  let dirty = false;
  if (!s.memoTypes) {
    s.memoTypes = defTypes; dirty = true;
  } else {
    const missing = defTypes.filter(t => !s.memoTypes.includes(t));
    if (missing.length) { s.memoTypes = [...s.memoTypes, ...missing]; dirty = true; }
  }
  // 정시 자동 동기화 기본값 ON
  if (s.scheduledSync === undefined) { s.scheduledSync = true; dirty = true; }
  if (!s.tabOrder || !Array.isArray(s.tabOrder) || !s.tabOrder.length) {
    s.tabOrder = [...DEFAULT_SETTINGS.tabOrder]; dirty = true;
  } else {
    const missingTabs = DEFAULT_SETTINGS.tabOrder.filter(t => !s.tabOrder.includes(t));
    if (missingTabs.length) { s.tabOrder = [...s.tabOrder, ...missingTabs]; dirty = true; }
  }
  if (dirty) saveSettings(s);
  return s;
}

function saveData(key, arr) {
  lsSet(key, arr);
  updateStats();
  // 데이터 키(viral/memo/calls/imgMeta)만 자동 백업 트리거
  if ([KEYS.viral, KEYS.memo, KEYS.calls, KEYS.imgMeta].includes(key)) {
    clearTimeout(_autoBackupTimer);
    _autoBackupTimer = setTimeout(runAutoBackup, 10000); // 10초 후 실행
  }
}
function saveSettings(s) { lsSet(KEYS.settings, s); }

/* ============================================================
   INDEXEDDB
   ============================================================ */
function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('SmartArchiveDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('images')) {
        const store = db.createObjectStore('images', {keyPath:'id'});
        store.createIndex('createdAt','createdAt');
      }
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e);
  });
}

function idbPut(record) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readwrite');
    tx.objectStore('images').put(record).onsuccess = e => res(e.target.result);
    tx.onerror = e => rej(e);
  });
}

function idbGet(id) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readonly');
    tx.objectStore('images').get(id).onsuccess = e => res(e.target.result);
  });
}

function idbDelete(id) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readwrite');
    tx.objectStore('images').delete(id).onsuccess = () => res();
  });
}

async function idbSize() {
  return new Promise(res => {
    const tx = idb.transaction('images','readonly');
    const store = tx.objectStore('images');
    let total = 0;
    store.openCursor().onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { total += cursor.value.data.size || 0; cursor.continue(); }
      else res(total);
    };
  });
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function renderTabNav() {
  const s = getSettings();
  const order = (s.tabOrder && s.tabOrder.length) ? s.tabOrder : DEFAULT_SETTINGS.tabOrder;
  document.getElementById('tabnav').innerHTML = order.filter(id => TAB_DEFS[id]).map(id => {
    const def = TAB_DEFS[id];
    const active = id === currentTab ? ' active' : '';
    return `<button class="tab-btn${active}" data-tab="${id}" draggable="true"
      onclick="switchTab('${id}')"
      ondragstart="onTabDragStart(event,'${id}')"
      ondragover="onTabDragOver(event,'${id}')"
      ondragleave="onTabDragLeave(event)"
      ondrop="onTabDrop(event,'${id}')"
      ondragend="onTabDragEnd(event)">${def.icon} ${def.label}</button>`;
  }).join('');
  setupTabDropTargets();
}

function onTabDragStart(e, tabId) {
  tabDragSrc = tabId;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function onTabDragOver(e, tabId) {
  if (!tabDragSrc || tabDragSrc === tabId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.tab-btn.tab-reorder-over').forEach(el => el.classList.remove('tab-reorder-over'));
  e.currentTarget.classList.add('tab-reorder-over');
}
function onTabDragLeave(e) {
  e.currentTarget.classList.remove('tab-reorder-over');
}
function onTabDrop(e, tabId) {
  e.preventDefault();
  e.currentTarget.classList.remove('tab-reorder-over');
  if (!tabDragSrc || tabDragSrc === tabId) { tabDragSrc = null; return; }
  const s = getSettings();
  const order = [...((s.tabOrder && s.tabOrder.length) ? s.tabOrder : DEFAULT_SETTINGS.tabOrder)];
  const fromIdx = order.indexOf(tabDragSrc);
  const toIdx = order.indexOf(tabId);
  if (fromIdx === -1 || toIdx === -1) { tabDragSrc = null; return; }
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, tabDragSrc);
  s.tabOrder = order;
  saveSettings(s);
  tabDragSrc = null;
  renderTabNav();
  toast('탭 순서가 변경되었습니다');
}
function onTabDragEnd(e) {
  tabDragSrc = null;
  document.querySelectorAll('.tab-btn.dragging, .tab-btn.tab-reorder-over').forEach(el => el.classList.remove('dragging','tab-reorder-over'));
}

function switchTab(tab) {
  exitSelectMode();
  currentTab = tab;
  selectedId = null;
  currentFilter = {type:'전체', channel:'전체', category:'전체', status:'전체', tags:[], search:''};

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  const isListTab = ['viral','memo','calls','images'].includes(tab);
  document.getElementById('list-panel').style.display = isListTab ? 'flex' : 'none';
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('no-detail').style.display = isListTab ? 'flex' : 'none';
  document.getElementById('form-area').style.display = tab === 'add' ? 'block' : 'none';
  document.getElementById('settings-area').style.display = tab === 'settings' ? 'block' : 'none';
  document.getElementById('sidebar').style.display = isListTab ? 'block' : 'none';

  if (isListTab) {
    renderSidebar();

  } else if (tab === 'add') {

  } else if (tab === 'settings') {

      ${(currentFilter.dateFrom||currentFilter.dateTo)?`<button onclick="clearDateFilter()" style="font-size:11px;color:var(--text-muted);background:none;border:none;cursor:pointer;text-align:left;padding:0;margin-top:2px">✕ 날짜 초기화</button>`:''}
    </div>
  </div>`;

  document.getElementById('sidebar-content').innerHTML = html;
}

function setDateFilter(side, val) {
  if (side === 'from') currentFilter.dateFrom = val;
  else currentFilter.dateTo = val;
  renderSidebar();
  renderList();
}

function clearDateFilter() {
  currentFilter.dateFrom = '';
  currentFilter.dateTo = '';
  renderSidebar();
  renderList();
}

function setSort(dir) {
  currentSort = dir;
  renderSidebar();
  renderList();
}

function sidebarSection(title, items, filterKey) {
  let html = `<div class="sidebar-section"><div class="sidebar-label">${title}</div>`;
  items.forEach(item => {
    const active = currentFilter[filterKey] === item.value;
    const dot = item.color ? `<span class="sidebar-dot" style="background:${item.color}"></span>` : '';
    html += `<div class="sidebar-item ${active?'active':''}" onclick="setFilter('${filterKey}','${item.value}')">${dot}${item.label}</div>`;
  });
  html += '</div>';
  return html;
}

function setFilter(key, value) {
  currentFilter[key] = value;
  renderSidebar();
  renderList();
  renderTagStrip();
}

/* ============================================================
   TAG STRIP
   ============================================================ */
function renderTagStrip() {
  const allItems = getFilteredItems();
  const tagCount = {};
  allItems.forEach(item => {
    (item.tags || []).forEach(t => { tagCount[t] = (tagCount[t]||0) + 1; });
  });
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([t])=>t);

  const strip = document.getElementById('tag-strip');
  if (!topTags.length) { strip.innerHTML = ''; return; }

  strip.innerHTML = topTags.map(t => {
    const active = currentFilter.tags.includes(t);
    return `<span class="tag-chip ${active?'active':''}" onclick="toggleTagFilter('${t}')">${t}</span>`;
  }).join('');
}

function toggleTagFilter(tag) {
  const idx = currentFilter.tags.indexOf(tag);
  if (idx >= 0) currentFilter.tags.splice(idx,1);
  else currentFilter.tags.push(tag);
  renderList();
  renderTagStrip();
}

/* ============================================================
   SEARCH
   ============================================================ */
function onSearch() {
  currentFilter.search = document.getElementById('search-input').value.toLowerCase();
  renderList();
}

/* ============================================================
   LIST RENDER
   ============================================================ */
function getFilteredItems() {
  let items = [];
  const s = currentFilter.search;

  if (currentTab === 'viral') {
    items = getData(KEYS.viral);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
    if (currentFilter.channel !== '전체') items = items.filter(i=>(i.channel||i.platform)===currentFilter.channel);
    if (currentFilter.category !== '전체') items = items.filter(i=>i.category===currentFilter.category);
    if (currentFilter.status !== '전체') items = items.filter(i=>(i.status||'보관')===currentFilter.status);
  } else if (currentTab === 'memo') {
    items = getData(KEYS.memo);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
    if (currentFilter.status !== '전체') items = items.filter(i=>(i.status||'보관')===currentFilter.status);
  } else if (currentTab === 'calls') {
    items = getData(KEYS.calls);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
  } else if (currentTab === 'images') {
    items = getData(KEYS.imgMeta);
    if (currentFilter.category !== '전체') items = items.filter(i=>i.category===currentFilter.category);
  }

  if (currentFilter.tags.length > 0) {
    items = items.filter(i => currentFilter.tags.every(t => (i.tags||[]).includes(t)));
  }

  if (currentFilter.rating > 0) {
    items = items.filter(i => (i.rating || 0) >= currentFilter.rating);
  }

  if (currentFilter.dateFrom || currentFilter.dateTo) {
    items = items.filter(i => {
      const d = (i.date || i.collectedAt || i.savedAt || '').slice(0,10);
      if (!d) return true;
      if (currentFilter.dateFrom && d < currentFilter.dateFrom) return false;
      if (currentFilter.dateTo   && d > currentFilter.dateTo)   return false;
      return true;
    });
  }

  if (s) {
    items = items.filter(i =>
      (i.title||'').toLowerCase().includes(s) ||
      (i.content||'').toLowerCase().includes(s) ||
      (i.aiSummary||i.summary||'').toLowerCase().includes(s) ||
      (i.memo||i.myMemo||'').toLowerCase().includes(s) ||
      (i.tags||[]).join(' ').toLowerCase().includes(s)
    );
  }

  // 날짜 기준 정렬 (date > collectedAt > savedAt 우선순위)
  const getDate = i => (i.date || i.collectedAt || i.savedAt || '').slice(0, 10);
  items = items.slice().sort((a, b) => {
    const da = getDate(a), db = getDate(b);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return currentSort === 'asc' ? da.localeCompare(db) : db.localeCompare(da);
  });
  return items;
}

async function loadThumb(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const el = document.getElementById('thumb-'+id);
  if (el) el.src = url;
}

function fmtNum(n) {
  if (!n && n !== 0) return '-';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(0)+'K';
  return String(n);
}

async function loadDetailImg(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const el = document.getElementById('detail-img');
  if (el) el.src = url;
}

async function openLightbox(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

async function downloadImage(id, filename) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function fmtSize(bytes) {
  if (!bytes) return '-';
  if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1)+' MB';
  if (bytes > 1024) return (bytes/1024).toFixed(0)+' KB';
  return bytes+' B';
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('no-detail').style.display = 'flex';
  renderList();
}

function saveField(tab, id, field, value) {
  const key = tab === 'images' ? KEYS.imgMeta : KEYS[tab];
  if (!key) return;
  const arr = getData(key);
  const item = arr.find(i => i.id === id);
  if (!item || item[field] === value) return;
  item[field] = value;

  if (cardTitle && field === 'title') cardTitle.textContent = value;

function saveContentField(tab, id, value) {
  const key = KEYS[tab];
  const arr = getData(key);
  const item = arr.find(i => i.id === id);
  if (!item) return;
  const field = tab === 'calls' ? 'fullContent' : 'content';
  if (item[field] === value) return;
  item[field] = value;
  saveData(key, arr);
}

function toggleContentEdit(tab, id) {
  const view = document.getElementById(`content-view-${id}`);
  const edit = document.getElementById(`content-edit-${id}`);
  const saveBtn = document.getElementById(`content-save-${id}`);
  const toggleBtn = document.getElementById(`content-toggle-${id}`);
  if (!view || !edit) return;
  const editing = edit.style.display !== 'none';
  view.style.display = editing ? '' : 'none';
  edit.style.display = editing ? 'none' : '';
  if (saveBtn) saveBtn.style.display = editing ? 'none' : '';
  if (toggleBtn) toggleBtn.textContent = editing ? '✏️ 수정' : '✕ 취소';
  if (!editing) { edit.focus(); edit.setSelectionRange(edit.value.length, edit.value.length); }
}

function saveContentEdit(tab, id) {
  const edit = document.getElementById(`content-edit-${id}`);
  if (!edit) return;
  saveContentField(tab, id, edit.value);
  renderDetail(id);
  toast('내용 저장됨');
}

function starsHtml(tab, id, rating) {
  const r = rating || 0;
  return Array.from({length:5}, (_,i) => {
    const filled = i < r;
    return `<span style="font-size:14px;cursor:pointer;color:${filled?'#F59E0B':'#555'};transition:color .1s"
      onclick="event.stopPropagation();setRating('${tab}','${id}',${filled&&r===i+1?0:i+1})"
      title="${i+1}점${filled&&r===i+1?' (클릭으로 초기화)':''}">${filled?'★':'☆'}</span>`;
  }).join('');
}

function setRating(tab, id, stars) {
  const key = tab === 'viral' ? KEYS.viral : tab === 'calls' ? KEYS.calls : KEYS.memo;
  const arr = getData(key);
  const item = arr.find(i => i.id === id);
  if (!item) return;
  item.rating = stars;
  saveData(key, arr);
  renderList();
  if (selectedId === id) renderDetail(id);
}

function cycleStatus(tab, id) {
  const key = tab === 'viral' ? KEYS.viral : tab === 'calls' ? KEYS.calls : KEYS.memo;
  const arr = getData(key);
  const item = arr.find(i=>i.id===id);
  if (!item) return;
  const order = ['할일','검토','보관','읽음'];
  const cur = order.indexOf(item.status||'보관');
  item.status = order[(cur + 1) % order.length];
  saveData(key, arr);
  renderList();
  if (selectedId === id) renderDetail(id);
  toast('상태: ' + item.status);
}

function moveItem(fromTab, id, toTab) {
  const tabLabel = toTab === 'calls' ? '통화기록' : '메모함';
  showModal('이동 확인', `이 항목을 ${tabLabel}으로 이동하시겠습니까?`, [
    {label:'취소', cls:'btn-secondary', action:'closeModal()'},
    {label:'이동', cls:'btn-primary', action:`confirmMove('${fromTab}','${id}','${toTab}')`}
  ]);
}

function confirmMove(fromTab, id, toTab) {
  closeModal();
  const fromKey = KEYS[fromTab];
  const toKey = KEYS[toTab];
  const fromArr = getData(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if (idx === -1) return;
  const src = fromArr[idx];

  let newItem;
  if (fromTab === 'memo' && toTab === 'calls') {
    newItem = {
      id: genId('c'),
      title: src.title,
      type: '기타',
      date: src.savedAt || today(),
      duration: 0,
      attendees: [],
      fullContent: src.content || '',
      aiSummary: src.aiSummary || '',
      actionItems: [],
      tags: src.tags || [],
      myMemo: src.myThought || '',
      createdAt: today()
    };
  } else if (fromTab === 'calls' && toTab === 'memo') {
    newItem = {
      id: genId('m'),
      type: '메모',
      title: src.title,
      content: src.fullContent || '',
      url: '',
      myThought: src.myMemo || '',
      tags: src.tags || [],
      aiSummary: src.aiSummary || '',
      savedAt: src.date || today()
    };
  } else if (fromTab === 'viral' && toTab === 'memo') {
    newItem = {
      id: genId('m'),
      type: '메모',
      title: src.title,
      content: src.content || '',
      url: src.url || '',
      myThought: '',
      tags: src.tags || [],
      aiSummary: src.aiSummary || '',
      savedAt: src.originalDate || today()
    };
  } else if (fromTab === 'viral' && toTab === 'calls') {
    newItem = {
      id: genId('c'),
      title: src.title,
      type: '기타',
      date: src.originalDate || today(),
      duration: 0,
      attendees: [],
      fullContent: src.content || '',
      aiSummary: src.aiSummary || '',
      actionItems: [],
      tags: src.tags || [],
      myMemo: '',
      createdAt: today()
    };
  } else if (fromTab === 'memo' && toTab === 'viral') {
    newItem = {
      id: genId('v'),
      title: src.title,
      channel: '메모',
      type: '메모',
      category: '',
      author: '',
      originalDate: src.savedAt || today(),
      collectedAt: today(),
      views: 0, likes: 0, comments: 0,
      content: src.content || '',
      url: src.url || '',
      aiSummary: src.aiSummary || '',
      tags: src.tags || []
    };
  } else if (fromTab === 'calls' && toTab === 'viral') {
    newItem = {
      id: genId('v'),
      title: src.title,
      channel: '통화',
      type: '미팅',
      category: '',
      author: '',
      originalDate: src.date || today(),
      collectedAt: today(),
      views: 0, likes: 0, comments: 0,
      content: src.fullContent || '',
      url: '',
      aiSummary: src.aiSummary || '',
      tags: src.tags || []
    };
  } else {
    return;
  }

  fromArr.splice(idx, 1);
  saveData(fromKey, fromArr);

  const toArr = getData(toKey);
  toArr.push(newItem);  // 배열 끝 추가 → .reverse() 후 최상단 표시
  saveData(toKey, toArr);

  const tabLabels = {viral:'바이럴', memo:'메모함', calls:'통화기록'};
  switchTab(toTab);
  selectedId = newItem.id;
  renderList();
  renderDetail(newItem.id);
  toast(`✅ ${tabLabels[toTab]||toTab}으로 이동됨`);
}

async function quickDelete(tab, id) {
  if (tab === 'viral')  saveData(KEYS.viral,   getData(KEYS.viral).filter(i=>i.id!==id));
  else if (tab === 'memo')   saveData(KEYS.memo,    getData(KEYS.memo).filter(i=>i.id!==id));

  else if (tab === 'images') { saveData(KEYS.imgMeta, getData(KEYS.imgMeta).filter(i=>i.id!==id)); await idbDelete(id); }
  if (selectedId === id) {
    selectedId = null;
    document.getElementById('detail-panel').classList.remove('visible');
    document.getElementById('no-detail').style.display = 'flex';
  }
  renderList(); updateStats();
  toast('삭제됨');
}

async function confirmDelete(tab, id) {
  closeModal();
  if (tab === 'viral') {
    const arr = getData(KEYS.viral).filter(i=>i.id!==id);
    saveData(KEYS.viral, arr);
  } else if (tab === 'memo') {
    const arr = getData(KEYS.memo).filter(i=>i.id!==id);
    saveData(KEYS.memo, arr);
  } else if (tab === 'calls') {
    const arr = getData(KEYS.calls).filter(i=>i.id!==id);
    saveData(KEYS.calls, arr);
  } else if (tab === 'images') {

  document.getElementById('no-detail').style.display = 'flex';

  toast('삭제됨');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    toast('✅ 클립보드에 복사됐어요. Claude Code에 붙여넣으세요.');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ 클립보드에 복사됐어요.');
  });
}

function setupDropzone() {
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });

  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    handleImageFiles(e.dataTransfer.files);
  });
}

function handleImageFiles(files) {
  const allowed = ['image/jpeg','image/png','image/gif','image/webp'];
  Array.from(files).forEach(file => {
    if (!allowed.includes(file.type)) return;
    const id = genId('img');
    const reader = new FileReader();
    reader.onload = e => {
      addImageFiles.push({file, id, preview: e.target.result});
      renderPreviewGrid();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewGrid() {
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = addImageFiles.map((item, idx) => `

      <img src="${item.preview}" alt="">
      <div class="preview-remove" onclick="removePreview(${idx})">×</div>
    </div>`).join('');

function removePreview(idx) {
  addImageFiles.splice(idx, 1);

/* ============================================================
   TRANSCRIPT — PARSER & SCORER
   ============================================================ */
const HL_MARKERS = ['핵심','중요','결론','즉','따라서','포인트','정리하면','요약','왜냐하면','특히','이유는','비결','결국','실제로','구체적으로','예를 들','첫째','둘째','셋째','가장','핵심은','말씀드리','강조','주목','분명히','반드시','꼭','확실히'];

function parseTranscript(text) {
  if (!text || !text.trim()) return [];
  const segs = [];
  const isVTT = /WEBVTT|-->/.test(text);

  if (isVTT) {
    // Strip WEBVTT header line, NOTE blocks
    const clean = text.replace(/^WEBVTT[^\n]*\n/m, '').replace(/NOTE\b[\s\S]*?\n\n/g, '');
    const blocks = clean.split(/\n{2,}/).filter(b => b.trim());
    for (const block of blocks) {
      const lines = block.trim().split('\n');
      const tsIdx = lines.findIndex(l => /-->/.test(l));
      if (tsIdx === -1) continue;
      const tsLine = lines[tsIdx];
      const tm = tsLine.match(/(\d{1,2}:\d{2}:\d{2})/);
      const start = tm ? tm[1] : '';
      // text after timestamp line (skip cue number line before tsIdx)
      const segText = lines.slice(tsIdx + 1).join(' ')
        .replace(/<[^>]+>/g, '') // strip HTML tags in VTT
        .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
      if (segText.length < 2) continue;
      segs.push({start, text: segText, score: 0, isHighlight: false});
    }
  } else {
    // Plain text — split by double-newlines or single newlines
    const lines = text.split(/\n+/).map(l => l.trim()).filter(l => l.length > 15);
    lines.forEach(l => segs.push({start: '', text: l, score: 0, isHighlight: false}));
  }
  return segs;
}

function scoreSegments(segs, tags) {
  if (!segs.length) return segs;
  const avgLen = segs.reduce((s,g) => s + g.text.length, 0) / segs.length;
  const keywords = [...(tags||[]).map(t => t.toLowerCase()), ...HL_MARKERS.map(m => m.toLowerCase())];

  segs.forEach((seg, idx) => {
    let score = 0;
    const lower = seg.text.toLowerCase();
    keywords.forEach(kw => { if (lower.includes(kw)) score += 2; });
    if (seg.text.length > avgLen * 1.4) score += 1;
    const pos = idx / segs.length;
    if (pos < 0.12 || pos > 0.88) score += 1;
    seg.score = score;
  });

  // top 18% as highlights, min 3 max 15
  const sorted = [...segs].sort((a, b) => b.score - a.score);
  const n = Math.min(15, Math.max(3, Math.round(segs.length * 0.18)));
  const threshold = sorted[n - 1]?.score ?? 1;
  segs.forEach(seg => { seg.isHighlight = seg.score > 0 && seg.score >= threshold; });
  return segs;
}

function renderTranscriptViewer(item) {
  const raw = item.transcript || '';
  if (!raw.trim()) return '';
  const segs = scoreSegments(parseTranscript(raw), item.tags);
  if (!segs.length) return '<div style="color:var(--text-muted);font-size:12px;padding:6px">전문을 파싱할 수 없습니다. VTT 또는 TXT 형식을 확인해주세요.</div>';

  const highlights = segs.filter(s => s.isHighlight);

  const hlHtml = highlights.map(seg => `
    <div class="transcript-hl-item">
      ${seg.start ? `<span class="transcript-ts">${seg.start}</span>` : ''}
      <span class="transcript-hl-text">${seg.text.replace(/</g,'&lt;').slice(0, 220)}${seg.text.length > 220 ? '…' : ''}</span>
    </div>`).join('');

  const fullHtml = segs.map(seg => `
    <div class="ts-seg ${seg.isHighlight ? 'hl' : ''}">
      ${seg.start ? `<span class="transcript-ts">${seg.start}</span>` : ''}
      <span>${seg.text.replace(/</g,'&lt;')}</span>
    </div>`).join('');

  return `
  <div class="transcript-viewer">
    <div class="transcript-highlights-panel">
      <div class="transcript-panel-title">★ 주요 하이라이트 ${highlights.length}개</div>
      ${hlHtml || '<div style="color:var(--text-muted);font-size:12px">추출된 하이라이트 없음</div>'}
    </div>
    <details class="transcript-full-toggle">
      <summary>전체 전문 (${segs.length}개 세그먼트)</summary>
      <div class="transcript-full-body">${fullHtml}</div>
    </details>
    <div style="font-size:11px;color:var(--text-muted);margin-top:6px">★ 자동 추출된 핵심 구간 · 태그 키워드 + 중요 표현 기반</div>
  </div>`;
}

function getAllExistingTags() {
  const set = new Set();
  ['viral','memo','calls','image'].forEach(k => {
    (getData(KEYS[k])||[]).forEach(item => (item.tags||[]).forEach(t => set.add(t)));
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}

/* ---- Form tag suggest ---- */
function initFormTagSuggest() {
  const input = document.getElementById('f-tags');
  if (!input) return;
  const allTags = getAllExistingTags();
  if (!allTags.length) return;
  // wrap input
  const parent = input.parentNode;
  const wrap = document.createElement('div');
  wrap.className = 'tag-suggest-wrap';
  parent.insertBefore(wrap, input);
  wrap.appendChild(input);
  // dropdown
  const drop = document.createElement('div');
  drop.className = 'tag-suggest-dropdown';
  drop.id = 'form-tag-drop';
  wrap.appendChild(drop);
  // existing chips label + chips
  const chipsWrap = document.createElement('div');
  chipsWrap.className = 'tag-existing-chips';
  chipsWrap.id = 'form-tag-chips';
  parent.appendChild(chipsWrap);
  renderFormTagChips(allTags, input, chipsWrap);

  input.addEventListener('input', () => updateFormTagDrop(input, drop, allTags));
  input.addEventListener('focus', () => updateFormTagDrop(input, drop, allTags));
  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) drop.classList.remove('open');
  }, {capture:true});
}

function renderFormTagChips(allTags, input, chipsWrap) {
  chipsWrap.innerHTML = allTags.slice(0,30).map(t =>
    `<span class="tag-existing-chip" onmousedown="appendFormTag(event,'${t.replace(/'/g,"\\'")}')">${t}</span>`
  ).join('');
}

function appendFormTag(e, tag) {
  e.preventDefault();
  const input = document.getElementById('f-tags');
  if (!input) return;
  const current = parseTags(input.value);
  if (!current.includes(tag)) current.push(tag);
  input.value = current.join(', ');
  document.getElementById('form-tag-drop')?.classList.remove('open');
}

function updateFormTagDrop(input, drop, allTags) {
  const parts = input.value.split(',');
  const typing = parts[parts.length-1].trim().toLowerCase();
  if (!typing) { drop.classList.remove('open'); return; }
  const already = parseTags(input.value);
  const matches = allTags.filter(t => t.toLowerCase().includes(typing) && !already.includes(t));
  if (!matches.length) { drop.classList.remove('open'); return; }
  drop.innerHTML = matches.slice(0,10).map(t =>
    `<div class="tag-suggest-item" onmousedown="pickFormTagDrop(event,'${t.replace(/'/g,"\\'")}')">${t}</div>`
  ).join('');
  drop.classList.add('open');
}

function pickFormTagDrop(e, tag) {
  e.preventDefault();
  const input = document.getElementById('f-tags');
  if (!input) return;
  const parts = input.value.split(',');
  parts[parts.length-1] = tag;
  input.value = parts.map(p=>p.trim()).join(', ') + ', ';
  document.getElementById('form-tag-drop')?.classList.remove('open');
  input.focus();
}

    `<div class="tag-suggest-item" onmousedown="pickDetailTag(event,'${tabKey}','${id}','${t.replace(/'/g,"\\'")}')">${t}</div>`

async function updateUsageInfo() {
  const lsSize = JSON.stringify(localStorage).length;
  const idbBytes = await idbSize();
  const el = document.getElementById('usage-info');
  if (el) {
    el.innerHTML = `localStorage: ${fmtSize(lsSize)} / IndexedDB: ${fmtSize(idbBytes)}`;
  }
}

  if (!name) return;
  const s = getSettings();
  if (!s.memoTypes) s.memoTypes = [...DEFAULT_SETTINGS.memoTypes];
  if (s.memoTypes.includes(name)) { toast('이미 존재하는 유형입니다'); return; }
  s.memoTypes.push(name);
  saveSettings(s);
  renderSettings();
  toast('메모 유형 추가됨');
}

function deleteMemoType(i) {
  const s = getSettings();
  if (!s.memoTypes || s.memoTypes.length <= 1) { toast('최소 1개 이상이어야 합니다'); return; }
  const removed = s.memoTypes[i];
  const locked = ['유튜브링크','인스타링크','스레드링크'];
  if (locked.includes(removed)) { toast(`'${removed}'은 기본 유형이라 삭제할 수 없습니다`); return; }
  s.memoTypes.splice(i, 1);
  saveSettings(s);
  renderSettings();
  toast(`'${removed}' 유형 삭제됨`);
}

/* PASSWORD */
async function changePassword() {
  const cur = document.getElementById('pw-cur').value.trim();
  const nw = document.getElementById('pw-new').value.trim();
  const conf = document.getElementById('pw-confirm').value.trim();
  if (nw !== conf) { toast('새 비밀번호가 일치하지 않습니다'); return; }
  if (!nw) { toast('새 비밀번호를 입력하세요'); return; }
  const curHash = await sha256(cur);
  const stored = _remotePwHash || lsGet(KEYS.password) || DEFAULT_PW_HASH;
  if (curHash !== stored) { toast('현재 비밀번호가 틀렸습니다'); return; }
  const newHash = await sha256(nw);
  lsSet(KEYS.password, newHash);
  toast('✅ 비밀번호 변경됨');
  document.getElementById('pw-cur').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
}

function _toBase64(str) {
  // 청크 단위 base64 — 대용량 데이터에서 메모리 초과 방지
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function _syncErrMsg(status, msg) {
  if (status === 401) return 'PAT가 만료되었거나 권한이 없습니다 (401)';
  if (status === 403) return 'API 접근 거부 — PAT에 repo 권한을 확인하세요 (403)';
  if (status === 404) return '레포지토리를 찾을 수 없습니다 (404)';
  if (status === 409) return 'SHA 충돌 — 다시 시도해주세요 (409)';
  if (status === 422) return '데이터 형식 오류 (422)';
  return msg || `오류 ${status}`;
}

async function syncToGitHub(showFeedback = true) {
  const pat = lsGet('sa_github_pat');
  if (!pat) { if (showFeedback) toast('⚠️ GitHub PAT를 먼저 입력하세요'); return; }
  const repo = 'GEUNEEE/smart-archive';
  const path = 'data/user_data.json';
  if (showFeedback) toast('🔄 GitHub에 저장 중...');

  const payload = {
    version: '5.1',
    savedAt: new Date().toISOString(),
    viral:  getData(KEYS.viral),
    memo:   getData(KEYS.memo),
    calls:  getData(KEYS.calls),
  };

  try {
    const h = {
      'Authorization': 'token ' + pat,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
    const apiBase = 'https://api.github.com/repos/' + repo + '/contents/' + path;

    // SHA 조회 (없으면 신규 파일로 생성)
    const getRes = await fetch(apiBase, {headers: h});
    let sha;
    if (getRes.ok) {
      sha = (await getRes.json()).sha;
    } else if (getRes.status !== 404) {
      const e = await getRes.json().catch(()=>({}));
      throw new Error(_syncErrMsg(getRes.status, e.message));
    }

    const content = _toBase64(JSON.stringify(payload, null, 2));
    const putRes = await fetch(apiBase, {
      method: 'PUT', headers: h,
      body: JSON.stringify({
        message: 'sync: ' + new Date().toISOString().slice(0, 16),
        content,
        ...(sha ? {sha} : {})
      })
    });
    if (!putRes.ok) {
      const e = await putRes.json().catch(()=>({}));
      throw new Error(_syncErrMsg(putRes.status, e.message));
    }
    lsSet('sa_last_github_sync', new Date().toISOString());
    if (showFeedback) { toast('✅ GitHub 동기화 완료'); renderSettings(); }
  } catch(e) {
    const msg = '⚠️ 동기화 실패: ' + e.message;
    toast(msg); // showFeedback 관계없이 항상 표시
    console.error('[syncToGitHub]', e.message);
  }
}

async function fetchFromGitHub() {
  const pat = lsGet('sa_github_pat');
  if (!pat) { toast('⚠️ GitHub PAT를 먼저 입력하세요'); return; }
  const repo = 'GEUNEEE/smart-archive';
  toast('🔄 GitHub에서 불러오는 중...');
  try {
    const res = await fetch('https://api.github.com/repos/' + repo + '/contents/data/user_data.json', {
      headers: {'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json'}
    });
    if (!res.ok) { toast('⚠️ GitHub에 저장된 데이터 없음 (먼저 업로드하세요)'); return; }
    const file = await res.json();
    const decoded = new TextDecoder().decode(
      Uint8Array.from(atob(file.content.replace(/\n/g,'')), c => c.charCodeAt(0))
    );
    const data = JSON.parse(decoded);

    let added = 0;
    for (const k of ['viral','memo','calls']) {
      if (!data[k] || !data[k].length) continue;
      const existing = getData(KEYS[k]);
      const existingIds = new Set(existing.map(i=>i.id).filter(Boolean));
      const newItems = data[k].filter(i => i.id && !existingIds.has(i.id));
      if (newItems.length) {
        saveData(KEYS[k], [...existing, ...newItems]);
        added += newItems.length;
      }
    }
    renderList(); renderSidebar(); updateStats();
    toast('✅ GitHub 동기화 완료 — ' + added + '개 추가됨 (' + (data.savedAt||'').slice(0,10) + ')');
    renderSettings();
  } catch(e) {
    toast('⚠️ 불러오기 실패: ' + e.message);
  }
}

/* SCHEDULED SYNC (06:00 · 12:00 · 18:00 · 00:00) */
const _SYNC_HOURS = [0, 6, 12, 18];

function startScheduledSync() {
  checkScheduledSync(); // 앱 열릴 때 즉시 확인 (놓친 정시 슬롯 처리)
  setInterval(checkScheduledSync, 60 * 1000); // 1분마다 체크
}

async function checkScheduledSync() {
  const s = getSettings();
  const pat = lsGet('sa_github_pat');
  if (!s.scheduledSync || !pat) return;

  const now = new Date();
  // 오늘 기준 이미 지난 정시 슬롯들
  const passedSlots = _SYNC_HOURS
    .map(h => { const d = new Date(now); d.setHours(h,0,0,0); return d; })
    .filter(d => d <= now);
  if (!passedSlots.length) return;

  // 가장 최근에 지난 슬롯
  const latestSlot = passedSlots[passedSlots.length - 1];
  const lastSync = lsGet('sa_last_github_sync');
  if (lastSync && new Date(lastSync) >= latestSlot) return; // 이미 동기화됨

  const h = latestSlot.getHours();
  try {
    await syncToGitHub(false);
    toast(`⏰ ${String(h).padStart(2,'0')}:00 정시 자동 동기화 완료`);
    renderSettings();
  } catch(e) {
    // 정시 동기화 실패는 조용히 처리 (toast 없음)
  }
}

function toggleScheduledSync() {
  const s = getSettings();
  s.scheduledSync = !s.scheduledSync;
  saveSettings(s);
  renderSettings();
}
