<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 아카이브 v4</title>
<style>
:root {
  --bg-primary: #0F0F0F;
  --bg-secondary: #1A1A1A;
  --bg-card: #242424;
  --bg-sidebar: #161616;
  --border: #2E2E2E;
  --text-primary: #F0F0F0;
  --text-secondary: #A0A0A0;
  --text-muted: #606060;
  --accent: #6366F1;
  --accent-hover: #818CF8;
  --success: #10B981;
  --warning: #F59E0B;
  --danger: #EF4444;
}
[data-theme="light"] {
  --bg-primary: #F8F8F8;
  --bg-secondary: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-sidebar: #F0F0F0;
  --border: #E0E0E0;
  --text-primary: #111111;
  --text-secondary: #555555;
  --text-muted: #999999;
  --accent: #6366F1;
  --accent-hover: #4F46E5;
  --success: #059669;
  --warning: #D97706;
  --danger: #DC2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;font-size:14px;}
button{cursor:pointer;border:none;outline:none;font-family:inherit;}
input,textarea,select{font-family:inherit;outline:none;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--accent-hover);}
/* ===== LOGIN ===== */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary);}
.login-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center;}
.login-logo{font-size:28px;font-weight:700;color:var(--text-primary);margin-bottom:8px;}
.login-sub{color:var(--text-muted);font-size:13px;margin-bottom:32px;}
.login-input{width:100%;padding:12px 16px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:15px;margin-bottom:16px;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:8px;font-size:15px;font-weight:600;transition:background .2s;}
.login-btn:hover{background:var(--accent-hover);}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;display:none;}
/* ===== APP ===== */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden;}
/* TOPBAR */
.topbar{height:52px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100;}
.topbar-logo{font-weight:700;font-size:16px;color:var(--text-primary);}
.topbar-stats{font-size:12px;color:var(--text-muted);flex:1;}
.topbar-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 10px;border-radius:6px;font-size:12px;transition:all .2s;}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);}
/* TAB NAV */
.tabnav{height:46px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:2px;flex-shrink:0;overflow-x:auto;}
.tabnav::-webkit-scrollbar{display:none;}
.tab-btn{padding:8px 14px;border-radius:6px;color:var(--text-muted);font-size:13px;font-weight:500;white-space:nowrap;background:transparent;transition:all .2s;}
.tab-btn:hover{color:var(--text-primary);background:var(--bg-card);}
.tab-btn.active{color:var(--accent);background:var(--bg-card);}
/* MAIN LAYOUT */
.main-area{display:flex;flex:1;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:200px;background:var(--bg-sidebar);border-right:1px solid var(--border);padding:12px;overflow-y:auto;flex-shrink:0;}
.sidebar-section{margin-bottom:20px;}
.sidebar-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-left:4px;}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--text-secondary);font-size:13px;transition:all .15s;}
.sidebar-item:hover{background:var(--bg-card);color:var(--text-primary);}
.sidebar-item.active{background:var(--accent);color:#fff;}
.sidebar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* LIST PANEL */
.list-panel{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.list-header{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input{width:100%;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;}
.search-input:focus{border-color:var(--accent);}
.tag-strip{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);}
.tag-chip{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.tag-chip:hover,.tag-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.list-items{flex:1;overflow-y:auto;padding:8px;}
.card{padding:12px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .15s;}
.card:hover{border-color:var(--accent);}
.card.active{border-color:var(--accent);background:var(--bg-secondary);}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.card-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4;}
.card-meta{font-size:11px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;}
.card-stats{font-size:11px;color:var(--text-secondary);margin-top:4px;}
/* DETAIL PANEL */
.detail-panel{flex:1;overflow-y:auto;padding:20px;display:none;}
.detail-panel.visible{display:block;}
.detail-title{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:12px;line-height:1.3;}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.detail-stats{display:flex;gap:16px;margin-bottom:16px;}
.stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center;flex:1;}
.stat-num{font-size:18px;font-weight:700;color:var(--text-primary);}
.stat-label{font-size:11px;color:var(--text-muted);}
.detail-section{margin-bottom:20px;}
.detail-section-title{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.detail-text{font-size:14px;color:var(--text-secondary);line-height:1.7;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;}
.detail-tag{padding:4px 12px;border-radius:20px;font-size:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);}
.memo-input{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:13px;resize:vertical;min-height:80px;}
.memo-input:focus{border-color:var(--accent);}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-warning{background:var(--warning);color:#fff;}
/* ADD FORM */
.form-area{flex:1;overflow-y:auto;padding:24px;max-width:700px;}
.form-title{font-size:20px;font-weight:700;margin-bottom:20px;}
.form-type-select{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.form-type-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);transition:all .2s;}
.form-type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;}
.form-input{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-textarea{width:100%;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;resize:vertical;min-height:120px;}
.form-textarea:focus{border-color:var(--accent);}
select.form-input{appearance:none;}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-muted);font-size:14px;}
.dropzone:hover,.dropzone.drag-over{border-color:var(--accent);color:var(--accent);}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
.preview-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;}
.preview-item img{width:100%;height:100%;object-fit:cover;}
.preview-remove{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
/* SETTINGS */
.settings-area{flex:1;overflow-y:auto;padding:24px;max-width:700px;}
.settings-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.settings-section-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text-primary);}
.channel-item,.category-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.channel-item:last-child,.category-item:last-child{border-bottom:none;}
.channel-color{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.channel-name{flex:1;font-size:13px;color:var(--text-primary);}
.channel-actions{display:flex;gap:6px;}
.mini-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.mini-btn.del:hover{border-color:var(--danger);color:var(--danger);}
/* IMG THUMBS IN LIST */
.img-thumb{width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:6px;}
/* LIGHTBOX */
#lightbox{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;}
#lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;line-height:1;}
/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;color:var(--text-primary);z-index:9998;transition:transform .3s;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;padding:24px;width:420px;max-width:90vw;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
/* NO DETAIL */
.no-detail{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text-muted);font-size:14px;}
/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
  .sidebar.open{display:block;position:fixed;top:0;left:0;width:240px;height:100vh;z-index:500;border-right:1px solid var(--border);}
  .hamburger{display:flex!important;}
  .list-panel{width:100%;}
  .detail-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:400;background:var(--bg-primary);padding:16px;overflow-y:auto;}
  .detail-close-btn{display:flex!important;}
  .form-row{grid-template-columns:1fr;}
}
.hamburger{display:none;background:none;color:var(--text-primary);font-size:18px;padding:4px 8px;}
.detail-close-btn{display:none;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;color:var(--text-secondary);font-size:13px;border:none;background:none;}
/* USAGE BAR */
.usage-bar{background:var(--bg-primary);border-radius:4px;height:6px;margin-top:6px;overflow:hidden;}
.usage-fill{background:var(--accent);height:100%;border-radius:4px;transition:width .3s;}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
/* BEST BADGE */
.best-badge{background:#F59E0B;color:#000;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.5px;}
/* COLOR PICKER */
.color-opt{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;transition:border .15s;}
.color-opt.selected,.color-opt:hover{border-color:var(--text-primary);}
/* IMPORT MERGE BTNS */
.merge-row{display:flex;gap:8px;margin-top:8px;}
/* QUICK SAVE */
.quick-save-box{background:var(--bg-card);border:2px solid var(--accent);border-radius:14px;padding:20px;margin-bottom:24px;}
.quick-save-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.quick-save-title{font-size:16px;font-weight:700;color:var(--text-primary);}
.quick-save-desc{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.6;}
.quick-paste-area{width:100%;min-height:160px;padding:14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:13px;resize:vertical;line-height:1.7;transition:border .2s;font-family:inherit;}
.quick-paste-area:focus{border-color:var(--accent);}
.quick-save-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.form-divider{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--text-muted);font-size:12px;}
.form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:var(--border);}
/* PARSED PREVIEW */
.parsed-preview{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.parsed-preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.parsed-count{font-size:13px;font-weight:700;color:var(--text-primary);}
.parsed-item-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;transition:border .15s;}
.parsed-item-card:hover{border-color:var(--accent);}
.parsed-item-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.parsed-type-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.parsed-item-remove{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;}
.parsed-item-remove:hover{color:var(--danger);}
.parsed-title-input{width:100%;padding:7px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:13px;margin-bottom:6px;}
.parsed-title-input:focus{border-color:var(--accent);outline:none;}
.parsed-content-preview{font-size:12px;color:var(--text-muted);background:var(--bg-primary);border-radius:6px;padding:8px 10px;line-height:1.6;max-height:80px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
.parsed-type-select{font-size:12px;padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);}
.parsed-url-tag{font-size:11px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;display:inline-block;vertical-align:middle;}
.topic-input-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.topic-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent);color:#fff;}
.topic-chip-del{cursor:pointer;font-size:12px;line-height:1;opacity:.8;}
.topic-chip-del:hover{opacity:1;}
.topic-add-input{font-size:12px;padding:3px 8px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text-secondary);width:100px;}
.topic-add-input:focus{outline:none;border-color:var(--accent);color:var(--text-primary);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">📦 스마트 아카이브</div>
    <div class="login-sub">마케팅 수집 시스템 v4</div>
    <input class="login-input" type="password" id="pw-input" placeholder="비밀번호 입력" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-error" id="login-error">비밀번호가 틀렸습니다.</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:16px;">초기 비밀번호: 1234</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">☰</button>
    <div class="topbar-logo">📦 스마트 아카이브</div>
    <div class="topbar-stats" id="topbar-stats"></div>
    <button class="topbar-btn" onclick="toggleTheme()" id="theme-btn">☀️ 라이트</button>
    <button class="topbar-btn" onclick="doLogout()">로그아웃</button>
  </div>
  <!-- TAB NAV -->
  <div class="tabnav">
    <button class="tab-btn active" data-tab="viral" onclick="switchTab('viral')">📊 바이럴 아카이브</button>
    <button class="tab-btn" data-tab="memo" onclick="switchTab('memo')">💬 나의 메모함</button>
    <button class="tab-btn" data-tab="calls" onclick="switchTab('calls')">📞 통화 기록</button>
    <button class="tab-btn" data-tab="images" onclick="switchTab('images')">🖼 이미지 보관함</button>
    <button class="tab-btn" data-tab="add" onclick="switchTab('add')">➕ 새로 추가</button>
    <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ 설정</button>
  </div>
  <!-- MAIN AREA -->
  <div class="main-area">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div id="sidebar-content"></div>
    </div>
    <!-- LIST + DETAIL (viral/memo/calls/images) -->
    <div class="list-panel" id="list-panel">
      <div class="list-header">
        <input class="search-input" id="search-input" type="text" placeholder="🔍 검색..." oninput="onSearch()">
      </div>
      <div class="tag-strip" id="tag-strip"></div>
      <div class="list-items" id="list-items"></div>
    </div>
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close-btn" onclick="closeDetail()">← 목록으로</button>
      <div id="detail-content"></div>
    </div>
    <div class="no-detail" id="no-detail">← 항목을 선택하세요</div>
    <!-- ADD FORM -->
    <div class="form-area" id="form-area" style="display:none;">
      <div class="form-title">➕ 새로 추가</div>

      <!-- QUICK SAVE -->
      <div class="quick-save-box">
        <div class="quick-save-header">
          <span style="font-size:20px">📥</span>
          <span class="quick-save-title">빠른 저장</span>
        </div>
        <div class="quick-save-desc">카카오톡 대화, SNS 글, 링크, 메모 등 — 전체를 그대로 붙여넣으세요<br>메시지별로 자동 분리하고 유형을 감지합니다</div>

        <div class="quick-save-row">

              <button class="btn btn-secondary" onclick="analyzeQuickPaste()">다시 분석</button>
              <button class="btn btn-primary" onclick="saveAllParsedItems()">💾 전체 저장</button>

      <div class="form-divider">상세 입력</div>

        <button class="form-type-btn active" onclick="setFormType('viral')">📊 바이럴 글</button>
        <button class="form-type-btn" onclick="setFormType('memo')">💬 메모</button>
        <button class="form-type-btn" onclick="setFormType('call')">📞 통화 기록</button>
        <button class="form-type-btn" onclick="setFormType('image')">🖼 이미지</button>

      <div id="settings-content"></div>
    </div>
  </div>
</div>

<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close" onclick="closeLightbox()">×</span>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="toast"></div>

  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
/* ============================================================
   CONSTANTS & STORAGE KEYS
   ============================================================ */
const KEYS = {
  viral: 'sa_viral',
  memo: 'sa_memo',
  calls: 'sa_calls',
  imgMeta: 'sa_img_meta',
  settings: 'sa_settings',
  password: 'sa_password',
  theme: 'sa_theme'
};

const DEFAULT_PW_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // "1234"

const DEFAULT_SETTINGS = {
  channels: [
    {name:'유튜브',color:'#FF0000',active:true},
    {name:'스레드',color:'#7C4DBD',active:true},
    {name:'X',color:'#E0E0E0',active:true},
    {name:'인스타그램',color:'#E1306C',active:true}
  ],
  categories: [
    {name:'퍼스널브랜딩',color:'#0EA5E9'},
    {name:'스레드 글 작성',color:'#10B981'},
    {name:'카피라이팅',color:'#F59E0B'},
    {name:'제품리뷰',color:'#EF4444'},
    {name:'기타',color:'#6366F1'}
  ],
  callTypes: ['미팅','상담','브레인스토밍','업무협의','기타'],
  imageCategories: ['레퍼런스','콘텐츠아이디어','디자인','스크린샷','기타'],
  memoTypes: ['유튜브링크','인스타링크','아이디어','생각정리','기타링크','메모'],
  geminiApiKey: '',
  groqApiKey: ''
};

/* ============================================================
   STATE
   ============================================================ */
let currentTab = 'viral';
let currentFilter = {type:'전체', channel:'전체', category:'전체', tags:[], search:''};
let selectedId = null;
let formType = 'viral';
let addImageFiles = [];
let idb = null;
let groupedViewItems = [];

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  idb = await openIDB();
  checkTheme();
  checkAuth();
}

/* ============================================================
   SHA-256
   ============================================================ */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   AUTH
   ============================================================ */
function checkAuth() {
  const auth = sessionStorage.getItem('sa_auth');
  if (auth === '1') showApp();
}

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const hash = await sha256(pw);
  const stored = lsGet(KEYS.password) || DEFAULT_PW_HASH;
  if (hash === stored) {
    sessionStorage.setItem('sa_auth','1');
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  sessionStorage.removeItem('sa_auth');
  location.reload();
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  switchTab('viral');
  updateStats();
  setTimeout(autoImportFromServer, 1200);
}

async function autoImportFromServer() {
  try {
    const res = await fetch('./imports/latest.json?t=' + Date.now());
    if (!res.ok) return;
    const json = await res.json();
    if (!json.data || !json.exportedAt) return;

    const lastImport = localStorage.getItem('sa_last_auto_import');
    if (lastImport === json.exportedAt) return; // 이미 이 버전 적용됨

    let added = 0;
    if (json.data.viral && json.data.viral.length > 0) {
      const existing = getData(KEYS.viral);
      const existingUrls = new Set(existing.map(i => i.url).filter(Boolean));
      const newItems = json.data.viral.filter(i => i.url && !existingUrls.has(i.url));
      if (newItems.length > 0) {
        saveData(KEYS.viral, [...newItems, ...existing]);
        added = newItems.length;
      }
    }

    localStorage.setItem('sa_last_auto_import', json.exportedAt);
    if (added > 0) {
      updateStats();
      renderList();
      toast('🔄 수집 결과 ' + added + '개 자동 추가됨');
    }
  } catch(e) { /* 파일 없으면 무시 */ }
}

function manualImportFromServer() {
  localStorage.removeItem('sa_last_auto_import');
  autoImportFromServer().then(() => {});
}

/* ============================================================
   LOCALSTORAGE HELPERS
   ============================================================ */
function lsGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function getData(key) { return lsGet(key) || []; }
function getSettings() { return lsGet(KEYS.settings) || DEFAULT_SETTINGS; }

function saveData(key, arr) { lsSet(key, arr); updateStats(); }
function saveSettings(s) { lsSet(KEYS.settings, s); }

/* ============================================================
   INDEXEDDB
   ============================================================ */
function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('SmartArchiveDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('images')) {
        const store = db.createObjectStore('images', {keyPath:'id'});
        store.createIndex('createdAt','createdAt');
      }
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e);
  });
}

function idbPut(record) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readwrite');
    tx.objectStore('images').put(record).onsuccess = e => res(e.target.result);
    tx.onerror = e => rej(e);
  });
}

function idbGet(id) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readonly');
    tx.objectStore('images').get(id).onsuccess = e => res(e.target.result);
  });
}

function idbDelete(id) {
  return new Promise((res,rej) => {
    const tx = idb.transaction('images','readwrite');
    tx.objectStore('images').delete(id).onsuccess = () => res();
  });
}

async function idbSize() {
  return new Promise(res => {
    const tx = idb.transaction('images','readonly');
    const store = tx.objectStore('images');
    let total = 0;
    store.openCursor().onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { total += cursor.value.data.size || 0; cursor.continue(); }
      else res(total);
    };
  });
}

/* ============================================================
   THEME
   ============================================================ */
function checkTheme() {
  const t = lsGet(KEYS.theme) || 'dark';
  applyTheme(t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  lsSet(KEYS.theme, t);
  document.getElementById('theme-btn').textContent = t === 'dark' ? '☀️ 라이트' : '🌙 다크';
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats() {
  const v = getData(KEYS.viral).length;
  const m = getData(KEYS.memo).length;
  const c = getData(KEYS.calls).length;
  const i = getData(KEYS.imgMeta).length;
  document.getElementById('topbar-stats').textContent =
    `바이럴 ${v} · 메모 ${m} · 통화 ${c} · 이미지 ${i}`;
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(tab) {
  currentTab = tab;
  selectedId = null;
  currentFilter = {type:'전체', channel:'전체', category:'전체', tags:[], search:''};

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  const isListTab = ['viral','memo','calls','images'].includes(tab);
  document.getElementById('list-panel').style.display = isListTab ? 'flex' : 'none';
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('no-detail').style.display = isListTab ? 'flex' : 'none';
  document.getElementById('form-area').style.display = tab === 'add' ? 'block' : 'none';
  document.getElementById('settings-area').style.display = tab === 'settings' ? 'block' : 'none';
  document.getElementById('sidebar').style.display = isListTab ? 'block' : 'none';

  if (isListTab) {
    renderSidebar();
    renderList();
    renderTagStrip();
  } else if (tab === 'add') {
    setFormType(formType);
  } else if (tab === 'settings') {
    renderSettings();
  }

  closeSidebar();
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

function renderSidebar() {
  const s = getSettings();
  let html = '';

  if (currentTab === 'viral') {
    html += sidebarSection('유형', [
      {label:'전체', value:'전체'},
      {label:'바이럴', value:'바이럴'},
      {label:'판매글', value:'판매글'},
      {label:'레퍼런스', value:'레퍼런스'}
    ], 'type');
    html += sidebarSection('채널', [{label:'전체', value:'전체'}, ...s.channels.map(c=>({label:c.name, value:c.name, color:c.color}))], 'channel');
    html += sidebarSection('분류', [{label:'전체', value:'전체'}, ...s.categories.map(c=>({label:c.name, value:c.name, color:c.color}))], 'category');
  } else if (currentTab === 'memo') {
    html += sidebarSection('유형', [{label:'전체',value:'전체'}, ...(s.memoTypes||DEFAULT_SETTINGS.memoTypes).map(t=>({label:t,value:t}))], 'type');
  } else if (currentTab === 'calls') {
    html += sidebarSection('유형', [{label:'전체',value:'전체'}, ...(s.callTypes||DEFAULT_SETTINGS.callTypes).map(t=>({label:t,value:t}))], 'type');
  } else if (currentTab === 'images') {
    html += sidebarSection('카테고리', [{label:'전체',value:'전체'}, ...(s.imageCategories||DEFAULT_SETTINGS.imageCategories).map(t=>({label:t,value:t}))], 'category');
  }

  document.getElementById('sidebar-content').innerHTML = html;
}

function sidebarSection(title, items, filterKey) {
  let html = `<div class="sidebar-section"><div class="sidebar-label">${title}</div>`;
  items.forEach(item => {
    const active = currentFilter[filterKey] === item.value;
    const dot = item.color ? `<span class="sidebar-dot" style="background:${item.color}"></span>` : '';
    html += `<div class="sidebar-item ${active?'active':''}" onclick="setFilter('${filterKey}','${item.value}')">${dot}${item.label}</div>`;
  });
  html += '</div>';
  return html;
}

function setFilter(key, value) {
  currentFilter[key] = value;
  renderSidebar();
  renderList();
  renderTagStrip();
}

/* ============================================================
   TAG STRIP
   ============================================================ */
function renderTagStrip() {
  const allItems = getFilteredItems();
  const tagCount = {};
  allItems.forEach(item => {
    (item.tags || []).forEach(t => { tagCount[t] = (tagCount[t]||0) + 1; });
  });
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([t])=>t);

  const strip = document.getElementById('tag-strip');
  if (!topTags.length) { strip.innerHTML = ''; return; }

  strip.innerHTML = topTags.map(t => {
    const active = currentFilter.tags.includes(t);
    return `<span class="tag-chip ${active?'active':''}" onclick="toggleTagFilter('${t}')">${t}</span>`;
  }).join('');
}

function toggleTagFilter(tag) {
  const idx = currentFilter.tags.indexOf(tag);
  if (idx >= 0) currentFilter.tags.splice(idx,1);
  else currentFilter.tags.push(tag);
  renderList();
  renderTagStrip();
}

/* ============================================================
   SEARCH
   ============================================================ */
function onSearch() {
  currentFilter.search = document.getElementById('search-input').value.toLowerCase();
  renderList();
}

/* ============================================================
   LIST RENDER
   ============================================================ */
function getFilteredItems() {
  let items = [];
  const s = currentFilter.search;

  if (currentTab === 'viral') {
    items = getData(KEYS.viral);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
    if (currentFilter.channel !== '전체') items = items.filter(i=>i.channel===currentFilter.channel);
    if (currentFilter.category !== '전체') items = items.filter(i=>i.category===currentFilter.category);
  } else if (currentTab === 'memo') {
    items = getData(KEYS.memo);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
  } else if (currentTab === 'calls') {
    items = getData(KEYS.calls);
    if (currentFilter.type !== '전체') items = items.filter(i=>i.type===currentFilter.type);
  } else if (currentTab === 'images') {
    items = getData(KEYS.imgMeta);
    if (currentFilter.category !== '전체') items = items.filter(i=>i.category===currentFilter.category);
  }

  if (currentFilter.tags.length > 0) {
    items = items.filter(i => currentFilter.tags.every(t => (i.tags||[]).includes(t)));
  }

  if (s) {
    items = items.filter(i =>
      (i.title||'').toLowerCase().includes(s) ||
      (i.content||'').toLowerCase().includes(s) ||
      (i.aiSummary||'').toLowerCase().includes(s) ||
      (i.tags||[]).join(' ').toLowerCase().includes(s)
    );
  }

  return items.slice().reverse();
}

function renderList() {
  const items = getFilteredItems();
  const container = document.getElementById('list-items');
  if (!items.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>항목이 없습니다</div>';
    return;
  }

  const s = getSettings();

  if (currentTab === 'viral') {
    container.innerHTML = items.map(item => {
      const ch = s.channels.find(c=>c.name===item.channel)||{color:'#888'};
      const cat = s.categories.find(c=>c.name===item.category)||{color:'#888'};
      return `<div class="card ${selectedId===item.id?'active':''}" onclick="selectItem('${item.id}')">
        <div class="card-badges">
          <span class="badge" style="background:${ch.color}20;color:${ch.color}">${item.channel||'?'}</span>
          <span class="badge" style="background:#6366F120;color:#818CF8">${item.type||'바이럴'}</span>
          ${item.isBest?'<span class="best-badge">BEST</span>':''}
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span>${item.author||''}</span>
          <span>${item.originalDate||item.collectedAt||''}</span>
        </div>
        <div class="card-stats">👁 ${fmtNum(item.views)} · ❤️ ${fmtNum(item.likes)} · 💬 ${fmtNum(item.comments)}</div>
      </div>`;
    }).join('');
  } else if (currentTab === 'memo') {
    const ytItems = items.filter(i => i.type === '유튜브링크' && i.url);
    const groupBtn = items.length >= 2
      ? `<button class="btn btn-secondary" style="width:100%;font-size:12px;margin-bottom:6px" onclick="showGroupedView()">📋 ${items.length}개 항목 모아 보기 · AI 분석</button>`
      : '';
    const _st = getSettings();
    const hasAI = !!(_st.geminiApiKey || _st.groqApiKey);
    const ytAllBtn = ytItems.length >= 1
      ? `<button class="btn btn-primary" style="width:100%;font-size:12px;margin-bottom:10px;background:linear-gradient(135deg,#FF0000,#cc0000)" onclick="${hasAI ? 'autoAnalyzeAllYouTube()' : 'copyAllYouTubePrompts()'}">🤖 YouTube ${ytItems.length}개 ${hasAI ? '전체 자동 분석' : '전체 분석 프롬프트 복사'}</button>`
      : '';
    container.innerHTML = groupBtn + ytAllBtn + items.map(item => {
      const isYt = item.type === '유튜브링크' && item.url;
      const ytId = isYt ? extractYouTubeId(item.url) : null;
      const thumb = ytId ? `<img src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" style="width:100%;border-radius:6px;margin-bottom:6px;aspect-ratio:16/9;object-fit:cover">` : '';
      const hasAICard = hasAI;
      const ytBtn = isYt
        ? `<div style="margin-top:8px" onclick="event.stopPropagation()">
             <button class="btn btn-primary" style="width:100%;font-size:11px;padding:5px;background:#FF0000;border-color:#FF0000" onclick="${hasAICard ? `autoAnalyzeYouTube('${item.id}')` : `copyMemoAnalysisPrompt('${item.id}')`}">${hasAICard ? '🤖 자동 분석' : '🎬 분석 프롬프트 복사'}</button>
           </div>`
        : '';
      return `<div class="card ${selectedId===item.id?'active':''}" onclick="selectItem('${item.id}')">
        ${thumb}
        <div class="card-badges">
          <span class="badge" style="background:#6366F120;color:#818CF8">${item.type||'메모'}</span>
          ${(item.tags||[]).slice(0,2).map(t=>`<span class="badge" style="background:var(--bg-secondary);color:var(--text-muted)">${t}</span>`).join('')}
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-meta"><span>${item.savedAt||''}</span></div>
        ${ytBtn}
      </div>`;
    }).join('');
  } else if (currentTab === 'calls') {
    const groupBtn = items.length >= 2
      ? `<button class="btn btn-secondary" style="width:100%;font-size:12px;margin-bottom:10px" onclick="showGroupedView()">📋 ${items.length}개 항목 모아 보기 · AI 분석</button>`
      : '';
    container.innerHTML = groupBtn + items.map(item => `
      <div class="card ${selectedId===item.id?'active':''}" onclick="selectItem('${item.id}')">
        <div class="card-badges">
          <span class="badge" style="background:#10B98120;color:#10B981">${item.type||'미팅'}</span>
          ${(item.tags||[]).slice(0,2).map(t=>`<span class="badge" style="background:var(--bg-secondary);color:var(--text-muted)">${t}</span>`).join('')}
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span>⏱ ${item.duration||0}분</span>
          <span>👥 ${(item.attendees||[]).length}명</span>
          <span>${item.date||''}</span>
        </div>
      </div>`).join('');
  } else if (currentTab === 'images') {
    container.innerHTML = items.map(item => `
      <div class="card ${selectedId===item.id?'active':''}" onclick="selectItem('${item.id}')">
        <img class="img-thumb" id="thumb-${item.id}" src="" alt="">
        <div class="card-badges">
          <span class="badge" style="background:#F59E0B20;color:#F59E0B">${item.category||'기타'}</span>
        </div>
        <div class="card-title">${item.title}</div>
        <div class="card-meta"><span>${item.date||''}</span></div>
      </div>`).join('');
    items.forEach(item => loadThumb(item.id));
  }
}

async function loadThumb(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const el = document.getElementById('thumb-'+id);
  if (el) el.src = url;
}

function fmtNum(n) {
  if (!n && n !== 0) return '-';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(0)+'K';
  return String(n);
}

/* ============================================================
   SELECT ITEM → DETAIL
   ============================================================ */
function selectItem(id) {
  selectedId = id;
  renderList();
  renderDetail(id);
  if (currentTab === 'memo') {
    const item = getData(KEYS.memo).find(i => i.id === id);
    if (item?.type === '유튜브링크' && !item.aiSummary && (s => s.geminiApiKey || s.groqApiKey)(getSettings())) {
      setTimeout(() => autoAnalyzeYouTube(id), 400);
    }
  }
}

async function loadDetailImg(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const el = document.getElementById('detail-img');
  if (el) el.src = url;
}

async function openLightbox(id) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

async function downloadImage(id, filename) {
  const rec = await idbGet(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.data);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function fmtSize(bytes) {
  if (!bytes) return '-';
  if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1)+' MB';
  if (bytes > 1024) return (bytes/1024).toFixed(0)+' KB';
  return bytes+' B';
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('no-detail').style.display = 'flex';
  renderList();
}

/* ============================================================
   MEMO SAVE
   ============================================================ */
function saveMemo(tab, id) {
  const val = document.getElementById('detail-memo').value;
  if (tab === 'viral') {
    const arr = getData(KEYS.viral);
    const item = arr.find(i=>i.id===id);
    if (item) { item.myMemo = val; saveData(KEYS.viral, arr); toast('메모 저장됨'); }
  } else if (tab === 'memo') {
    const arr = getData(KEYS.memo);
    const item = arr.find(i=>i.id===id);
    if (item) { item.myThought = val; saveData(KEYS.memo, arr); toast('저장됨'); }
  } else if (tab === 'calls') {
    const arr = getData(KEYS.calls);
    const item = arr.find(i=>i.id===id);
    if (item) { item.myMemo = val; saveData(KEYS.calls, arr); toast('저장됨'); }
  } else if (tab === 'images') {
    const arr = getData(KEYS.imgMeta);
    const item = arr.find(i=>i.id===id);
    if (item) { item.memo = val; saveData(KEYS.imgMeta, arr); toast('저장됨'); }
  }
}

/* ============================================================
   BEST TOGGLE
   ============================================================ */
function toggleBest(id) {
  const arr = getData(KEYS.viral);
  const item = arr.find(i=>i.id===id);
  if (item) {
    item.isBest = !item.isBest;
    saveData(KEYS.viral, arr);
    renderDetail(id);
    renderList();
    toast(item.isBest ? '⭐ BEST 설정됨' : 'BEST 해제됨');
  }
}

/* ============================================================
   MOVE BETWEEN TABS
   ============================================================ */
function moveItem(fromTab, id, toTab) {
  const tabLabel = toTab === 'calls' ? '통화기록' : '메모함';
  showModal('이동 확인', `이 항목을 ${tabLabel}으로 이동하시겠습니까?`, [
    {label:'취소', cls:'btn-secondary', action:'closeModal()'},
    {label:'이동', cls:'btn-primary', action:`confirmMove('${fromTab}','${id}','${toTab}')`}
  ]);
}

function confirmMove(fromTab, id, toTab) {
  closeModal();
  const fromKey = KEYS[fromTab];
  const toKey = KEYS[toTab];
  const fromArr = getData(fromKey);
  const idx = fromArr.findIndex(i => i.id === id);
  if (idx === -1) return;
  const src = fromArr[idx];

  let newItem;
  if (fromTab === 'memo' && toTab === 'calls') {
    newItem = {
      id: genId('c'),
      title: src.title,
      type: '기타',
      date: src.savedAt || today(),
      duration: 0,
      attendees: [],
      fullContent: src.content || '',
      aiSummary: src.aiSummary || '',
      actionItems: [],
      tags: src.tags || [],
      myMemo: src.myThought || '',
      createdAt: today()
    };
  } else if (fromTab === 'calls' && toTab === 'memo') {
    newItem = {
      id: genId('m'),
      type: '메모',
      title: src.title,
      content: src.fullContent || '',
      url: '',
      myThought: src.myMemo || '',
      tags: src.tags || [],
      aiSummary: src.aiSummary || '',
      savedAt: src.date || today()
    };
  } else {
    return;
  }

  fromArr.splice(idx, 1);
  saveData(fromKey, fromArr);

  const toArr = getData(toKey);
  toArr.unshift(newItem);
  saveData(toKey, toArr);

  switchTab(toTab);
  selectedId = newItem.id;
  renderList();
  renderDetail(newItem.id);
  toast(`✅ ${toTab === 'calls' ? '통화기록' : '메모함'}으로 이동됨`);
}

/* ============================================================
   DELETE
   ============================================================ */
function deleteItem(tab, id) {
  showModal('삭제 확인', '정말 삭제하시겠습니까?', [
    {label:'취소', cls:'btn-secondary', action:'closeModal()'},
    {label:'삭제', cls:'btn-danger', action:`confirmDelete('${tab}','${id}')`}
  ]);
}

async function confirmDelete(tab, id) {
  closeModal();
  if (tab === 'viral') {
    const arr = getData(KEYS.viral).filter(i=>i.id!==id);
    saveData(KEYS.viral, arr);
  } else if (tab === 'memo') {
    const arr = getData(KEYS.memo).filter(i=>i.id!==id);
    saveData(KEYS.memo, arr);
  } else if (tab === 'calls') {
    const arr = getData(KEYS.calls).filter(i=>i.id!==id);
    saveData(KEYS.calls, arr);
  } else if (tab === 'images') {
    const arr = getData(KEYS.imgMeta).filter(i=>i.id!==id);
    saveData(KEYS.imgMeta, arr);
    await idbDelete(id);
  }
  selectedId = null;
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('no-detail').style.display = 'flex';
  renderList();
  renderTagStrip();
  toast('삭제됨');
}

${item.fullContent||''}

2. 주요 결정 사항
3. 액션 아이템 목록
4. 추천 태그 5개 이내`;
  copyToClipboard(prompt);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    toast('✅ 클립보드에 복사됐어요. Claude Code에 붙여넣으세요.');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ 클립보드에 복사됐어요.');
  });
}

function setupDropzone() {
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    handleImageFiles(e.dataTransfer.files);
  });
}

function handleImageFiles(files) {
  const allowed = ['image/jpeg','image/png','image/gif','image/webp'];
  Array.from(files).forEach(file => {
    if (!allowed.includes(file.type)) return;
    const id = genId('img');
    const reader = new FileReader();
    reader.onload = e => {
      addImageFiles.push({file, id, preview: e.target.result});
      renderPreviewGrid();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreviewGrid() {
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = addImageFiles.map((item, idx) => `
    <div class="preview-item">
      <img src="${item.preview}" alt="">
      <div class="preview-remove" onclick="removePreview(${idx})">×</div>
    </div>`).join('');
}

function removePreview(idx) {
  addImageFiles.splice(idx, 1);
  renderPreviewGrid();
}

async function saveImages() {
  const title = document.getElementById('f-title').value.trim();
  if (!title && addImageFiles.length > 1) { /* allow multiple with same base title */ }
  if (!addImageFiles.length) { toast('이미지를 선택하세요'); return; }
  const category = document.getElementById('f-category').value;
  const date = document.getElementById('f-date').value || today();
  const memo = document.getElementById('f-memo').value.trim();
  const tags = parseTags(document.getElementById('f-tags').value);

  const metaArr = getData(KEYS.imgMeta);

  for (const item of addImageFiles) {
    const meta = {
      id: item.id,
      title: addImageFiles.length === 1 ? (title||item.file.name) : (title ? title + ' ' + (addImageFiles.indexOf(item)+1) : item.file.name),
      category,
      date,
      filename: item.file.name,
      mimeType: item.file.type,
      sizeBytes: item.file.size,
      tags,
      memo,
      createdAt: new Date().toISOString()
    };
    await idbPut({id: item.id, data: item.file, mimeType: item.file.type, createdAt: meta.createdAt});
    metaArr.push(meta);
  }
  saveData(KEYS.imgMeta, metaArr);
  addImageFiles = [];
  toast(`✅ 이미지 ${metaArr.length > 0 ? addImageFiles.length || '여러 장' : ''} 저장됨`);
  setFormType('image');
}

async function changePassword() {

  if (curHash !== stored) { toast('현재 비밀번호가 틀렸습니다'); return; }

  document.getElementById('pw-cur').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
}

/* EXPORT / IMPORT */
function exportJSON() {
  const data = {
    version: '4.0',
    exportedAt: new Date().toISOString(),
    data: {
      viral: getData(KEYS.viral),
      memo: getData(KEYS.memo),
      calls: getData(KEYS.calls),
      imgMeta: getData(KEYS.imgMeta),
      settings: getSettings()
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `smart_archive_backup_${today()}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✅ JSON 내보내기 완료');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      if (!json.data) { toast('올바른 백업 파일이 아닙니다'); return; }
      showModal('데이터 가져오기', `
        <p style="color:var(--text-secondary);font-size:14px">가져오기 방식을 선택하세요.</p>
        <p style="font-size:13px;color:var(--text-muted);margin-top:8px">덮어쓰기: 현재 데이터를 모두 교체합니다<br>병합: 기존 데이터에 추가합니다</p>`,
        [{label:'취소',cls:'btn-secondary',action:'closeModal()'},
         {label:'병합',cls:'btn-secondary',action:`doImport(${JSON.stringify(JSON.stringify(json.data))}, 'merge')`},
         {label:'덮어쓰기',cls:'btn-danger',action:`doImport(${JSON.stringify(JSON.stringify(json.data))}, 'overwrite')`}]);
    } catch(err) {
      toast('JSON 파싱 오류');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function doImport(dataStr, mode) {
  closeModal();
  const data = JSON.parse(dataStr);
  if (mode === 'overwrite') {
    if (data.viral) saveData(KEYS.viral, data.viral);
    if (data.memo) saveData(KEYS.memo, data.memo);
    if (data.calls) saveData(KEYS.calls, data.calls);
    if (data.imgMeta) saveData(KEYS.imgMeta, data.imgMeta);
    if (data.settings) saveSettings(data.settings);
  } else {
    if (data.viral) {
      const existing = getData(KEYS.viral);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.viral, [...existing, ...data.viral.filter(i=>!ids.has(i.id))]);
    }
    if (data.memo) {
      const existing = getData(KEYS.memo);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.memo, [...existing, ...data.memo.filter(i=>!ids.has(i.id))]);
    }
    if (data.calls) {
      const existing = getData(KEYS.calls);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.calls, [...existing, ...data.calls.filter(i=>!ids.has(i.id))]);
    }
    if (data.imgMeta) {
      const existing = getData(KEYS.imgMeta);
      const ids = new Set(existing.map(i=>i.id));
      saveData(KEYS.imgMeta, [...existing, ...data.imgMeta.filter(i=>!ids.has(i.id))]);
    }
  }
  toast('✅ 가져오기 완료');
  updateStats();
}

async function importImages(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const allowed = ['image/jpeg','image/png','image/gif','image/webp'];
  const metaArr = getData(KEYS.imgMeta);
  for (const file of files) {
    if (!allowed.includes(file.type)) continue;
    const id = genId('img');
    await idbPut({id, data: file, mimeType: file.type, createdAt: new Date().toISOString()});
    metaArr.push({
      id, title: file.name, category: '기타', date: today(),
      filename: file.name, mimeType: file.type, sizeBytes: file.size,
      tags: [], memo: '', createdAt: new Date().toISOString()
    });
  }
  saveData(KEYS.imgMeta, metaArr);
  input.value = '';
  toast(`✅ 이미지 ${files.length}개 가져오기 완료`);
  updateUsageInfo();
}

  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ---- YouTube auto-analyze via Gemini ---- */
async function callGroqAPI(prompt, apiKey) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`},
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [{role: 'user', content: prompt}],
      max_tokens: 1024
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Groq API 오류 ${res.status}`);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || null;
}

async function autoAnalyzeYouTube(id) {
  const items = getData(KEYS.memo);
  const item = items.find(i => i.id === id);
  if (!item) return;

  const s = getSettings();
  if (!s.geminiApiKey && !s.groqApiKey) { copyMemoAnalysisPrompt(id); return; }

  const summaryEl = document.getElementById('detail-ai-summary');
  if (summaryEl) summaryEl.innerHTML = '<span style="color:var(--text-muted)">⏳ AI 분석 중...</span>';
  toast('YouTube 자동 분석 중...');

  try {
    let title = item.title, channel = '';
    try {
      const oe = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(item.url)}&format=json`);
      if (oe.ok) { const d = await oe.json(); title = d.title||title; channel = d.author_name||''; }
    } catch(e) {}

    const textPrompt = `다음 YouTube 영상을 분석해서 한국어로 요약해줘.\n\n제목: ${title}\n채널: ${channel}\nURL: ${item.url}\n${item.content ? '내 메모: '+item.content : ''}\n\n아래 형식으로 작성:\n## 핵심 요약\n(3~5줄)\n\n## 주요 인사이트\n• \n• \n• \n\n## 실용적 적용\n• \n\n## 핵심 키워드\n#키워드1 #키워드2 #키워드3`;

    let summary = null;

    // 1단계: Gemini 시도 (설정된 경우)
    if (s.geminiApiKey) {
      const BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
      for (const model of ['gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-flash-8b']) {
        const url = `${BASE}${model}:generateContent?key=${s.geminiApiKey}`;
        const r1 = await fetch(url, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({contents: [{parts: [
            {text: textPrompt},
            {fileData: {fileUri: item.url, mimeType: 'video/mp4'}}
          ]}]})
        }).catch(() => null);
        if (r1 && r1.ok) {
          const d = await r1.json();
          summary = d.candidates?.[0]?.content?.parts?.[0]?.text || null;
          if (summary) break;
        }
        const r2 = await fetch(url, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({contents: [{parts: [{text: textPrompt}]}]})
        }).catch(() => null);
        if (r2 && r2.ok) {
          const d2 = await r2.json();
          summary = d2.candidates?.[0]?.content?.parts?.[0]?.text || null;
          if (summary) break;
        }
      }
    }

    // 2단계: Groq fallback (Gemini 실패 또는 미설정)
    if (!summary && s.groqApiKey) {
      if (summaryEl) summaryEl.innerHTML = '<span style="color:var(--text-muted)">⏳ Groq(Llama) 분석 중...</span>';
      summary = await callGroqAPI(textPrompt, s.groqApiKey);
    }

    if (!summary) throw new Error('분석 응답을 받지 못했습니다');

    item.aiSummary = summary;
    saveData(KEYS.memo, items);
    renderDetail(id);
    toast('✅ 자동 분석 완료!');
  } catch(e) {
    const htmlMsg = e.message.replace(/\n/g, '<br>');
    if (summaryEl) summaryEl.innerHTML = `<span style="color:#EF4444">${htmlMsg}</span>`;
    toast('분석 실패: ' + e.message.split('\n')[0]);
  }
}

async function autoAnalyzeAllYouTube() {
  const _s = getSettings();
  if (!_s.geminiApiKey && !_s.groqApiKey) { toast('⚙️ 설정에서 Groq 또는 Gemini API 키를 먼저 입력하세요'); switchTab('settings'); return; }
  const pending = getData(KEYS.memo).filter(i => i.type === '유튜브링크' && i.url && !i.aiSummary);

  for (let i = 0; i < pending.length; i++) {

/* ============================================================
   QUICK SAVE — PARSER
   ============================================================ */
let parsedItems = [];

const TYPE_META = {
  'memo_유튜브링크': {label:'🎬 유튜브 링크', color:'#EF4444'},
  'memo_인스타링크': {label:'📸 인스타 링크', color:'#E1306C'},
  'memo_기타링크':   {label:'🔗 기타 링크',   color:'#6366F1'},
  'memo_아이디어':   {label:'💡 아이디어',     color:'#F59E0B'},
  'memo_생각정리':   {label:'🧠 생각 정리',    color:'#0EA5E9'},
  'memo_메모':       {label:'📝 메모',          color:'#A0A0A0'},
  'viral':           {label:'📊 바이럴 글',     color:'#10B981'},
  'call':            {label:'📞 통화/미팅',     color:'#8B5CF6'},
};

function guessChannel(text, url) {
  const s = (url || '') + ' ' + (text || '');
  if (/x\.com|twitter\.com/.test(s)) return 'X';
  if (/threads\.net/.test(s)) return '스레드';
  if (/instagram\.com/.test(s)) return '인스타그램';
  if (/youtube\.com|youtu\.be/.test(s)) return '유튜브';
  return 'X';
}

/* ---- URL type detection ---- */
function guessUrlType(url) {
  if (/youtube\.com|youtu\.be/.test(url)) return 'memo_유튜브링크';
  if (/instagram\.com|instagr\.am/.test(url)) return 'memo_인스타링크';
  if (/x\.com|twitter\.com/.test(url)) return 'viral';
  if (/threads\.net/.test(url)) return 'viral';
  return 'memo_기타링크';
}

/* ---- Topic auto-detection ---- */
const TOPIC_RULES = [
  {k:['부동산','아파트','오피스텔','힐스테이트','힐','빌라','상가','임대차','취등록','양도세','pir','전세가','매매가'], v:'부동산'},
  {k:['송도'], v:'송도'},
  {k:['판교','강남','분당','수원','용인','광교','위례'], v:'지역'},
  {k:['주식','보로노이','삼성물산','삼성화재','현대엘베','특수개발','매수','매도','종목','포트폴리오'], v:'주식'},
  {k:['법인','세무','세금','사업자','인건비','급여','조종료','세무사'], v:'법인/세무'},
  {k:['제품','제조','원료','패키지','moq','수면r','수면','원가','생산','상페'], v:'제품'},
  {k:['aeo','geo','seo','마케팅','광고','바이럴','전환율','ctr','캠페인','콘텐츠'], v:'마케팅'},
  {k:['대출','금리','ltv','담보','신용','레버리지'], v:'대출/금융'},
  {k:['정부지원','지원사업','보조금','정책자금'], v:'정부지원'},
  {k:['전세','월세','임대','보증금','계약'], v:'임대차'},
  {k:['투자','roi','수익률','배당'], v:'투자'},
];

function detectTopics(text, url) {
  const s = ((text||'') + ' ' + (url||'')).toLowerCase();
  const found = [];
  for (const rule of TOPIC_RULES) {
    if (rule.k.some(k => s.includes(k.toLowerCase())) && !found.includes(rule.v)) {
      found.push(rule.v);
    }
  }
  return found.slice(0, 4);
}

/* ---- Text-only memo classifier ---- */
function classifyText(text) {
  const t = text.toLowerCase();
  if (/회의|미팅|통화|상담|참석|액션|결론|안건|다음 주|다음주|일정/.test(t)) return 'call';
  if (/조회수|좋아요|댓글수|팔로워|바이럴|훅|cta|광고비|전환율/.test(t)) return 'viral';
  if (/\d+억|\d+만원|\d+천만|수익률|roi|pir|대출|매출|비용|법인|투자|주식/.test(t)) return 'memo_생각정리';
  if (text.trim().split('\n').length <= 2 && text.length < 120) return 'memo_아이디어';
  if (text.trim().split('\n').length >= 4) return 'memo_생각정리';
  return 'memo_메모';
}

/* ---- Extract items from a single message's content ---- */
function extractItemsFromContent(content) {
  const urlRegex = /https?:\/\/[^\s\]]+/g;
  const urls = [...new Set(content.match(urlRegex) || [])];
  const textWithoutUrls = content.replace(urlRegex, '').replace(/\n{3,}/g, '\n\n').trim();
  const items = [];

  for (const url of urls) {
    const type = guessUrlType(url);
    // 제목: URL 다음에 오는 텍스트가 있으면 그걸 제목으로, 없으면 URL 도메인
    const contextText = textWithoutUrls.split('\n')[0].trim();
    const domain = url.replace(/https?:\/\//,'').split('/')[0];
    const title = contextText || domain;
    const shortTitle = title.length > 70 ? title.slice(0, 70) + '...' : title;
    const topics = detectTopics(content, url);
    items.push({ type, title: shortTitle, content: textWithoutUrls, url, topics });
  }

  // 텍스트 파트: URL의 단순 레이블(짧고 1~2줄)이면 별도 아이템 안 만듦
  if (textWithoutUrls) {
    const isShortLabel = urls.length > 0 && textWithoutUrls.split('\n').length <= 2 && textWithoutUrls.length < 80;
    if (!isShortLabel) {
      const type = classifyText(textWithoutUrls);
      const firstLine = textWithoutUrls.split('\n')[0].trim();
      const title = firstLine.length > 70 ? firstLine.slice(0, 70) + '...' : firstLine;
      const topics = detectTopics(textWithoutUrls, '');
      items.push({ type, title, content: textWithoutUrls, url: '', topics });
    }
  }

  return items;
}

/* ---- KakaoTalk format parser ---- */
function isKakaoFormat(text) {
  return /\[.+?\] \[(?:오전|오후) \d+:\d+\]/.test(text);
}

function parseKakaoMessages(text) {
  const lines = text.split('\n');
  const headerRe = /^\[(.+?)\] \[(?:오전|오후) \d+:\d+\] (.*)$/;
  const sectionRe = /^\[([^\]]+)\]$/; // 예: [정부지원사업]

  const messages = [];
  let cur = null;

  for (const line of lines) {
    const hm = headerRe.exec(line);
    if (hm) {
      if (cur) messages.push(cur);
      cur = { content: hm[2] };
      continue;
    }
    const sm = sectionRe.exec(line.trim());
    if (sm && !cur) {
      // standalone section header — treat as memo
      messages.push({ content: line.trim() });
      continue;
    }
    if (cur) {
      if (line.trim()) cur.content += '\n' + line;
    }
  }
  if (cur) messages.push(cur);
  return messages;
}

/* ---- Plain text parser (non-kakao) ---- */
function parsePlainText(text) {
  // Split by blank lines
  const blocks = text.split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
  return blocks.map(b => ({ content: b }));
}

/* ---- Main analysis function ---- */
function analyzeQuickPaste() {
  const text = document.getElementById('quick-paste').value.trim();
  if (!text) { toast('내용을 붙여넣으세요'); return; }

  const messages = isKakaoFormat(text) ? parseKakaoMessages(text) : parsePlainText(text);

  parsedItems = [];
  for (const msg of messages) {
    if (!msg.content.trim()) continue;
    const extracted = extractItemsFromContent(msg.content.trim());
    parsedItems.push(...extracted);
  }

  // Deduplicate by url
  const seenUrls = new Set();
  parsedItems = parsedItems.filter(item => {
    if (!item.url) return true;
    if (seenUrls.has(item.url)) return false;
    seenUrls.add(item.url);
    return true;
  });

  renderParsedPreview();
  document.getElementById('parsed-preview').style.display = parsedItems.length ? 'block' : 'none';
  if (!parsedItems.length) toast('항목을 감지하지 못했습니다');
}

/* ---- Render preview cards ---- */
function renderParsedPreview() {
  const count = parsedItems.length;
  document.getElementById('parsed-count').textContent = `${count}개 항목 감지됨`;

  const html = parsedItems.map((item, idx) => {
    const meta = TYPE_META[item.type] || TYPE_META['memo_메모'];
    const preview = (item.content || '').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    const previewShort = preview.length > 300 ? preview.slice(0,300) + '...' : preview;
    const chips = (item.topics||[]).map((t,ti) =>
      `<span class="topic-chip">${t}<span class="topic-chip-del" onclick="removeTopic(${idx},${ti})">×</span></span>`
    ).join('');

    return `
    <div class="parsed-item-card" id="pcard-${idx}">
      <div class="parsed-item-top">
        <select class="parsed-type-select" onchange="updateParsedType(${idx},this.value)">
          ${Object.entries(TYPE_META).map(([v,m])=>`<option value="${v}" ${v===item.type?'selected':''}>${m.label}</option>`).join('')}
        </select>
        <button class="parsed-item-remove" onclick="removeParsedItem(${idx})" title="삭제">✕</button>
      </div>
      <input class="parsed-title-input" value="${(item.title||'').replace(/"/g,'&quot;').replace(/'/g,"&#39;")}" placeholder="제목" oninput="updateParsedTitle(${idx},this.value)">
      <div class="topic-input-wrap">
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">주제:</span>
        ${chips}
        <input class="topic-add-input" placeholder="+ 주제 추가" onkeydown="addTopicOnEnter(event,${idx},this)">
      </div>
      ${item.url ? `<div style="margin-bottom:6px;overflow:hidden"><span class="parsed-url-tag" title="${item.url}">🔗 ${item.url}</span></div>` : ''}
      ${previewShort ? `<div class="parsed-content-preview">${previewShort}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('parsed-items-list').innerHTML = html ||
    '<div style="color:var(--text-muted);font-size:13px;padding:8px">감지된 항목이 없습니다</div>';
}

function updateParsedType(idx, val) {
  parsedItems[idx].type = val;
}
function updateParsedTitle(idx, val) {
  parsedItems[idx].title = val;
}
function removeParsedItem(idx) {
  parsedItems.splice(idx, 1);
  renderParsedPreview();
  document.getElementById('parsed-count').textContent = `${parsedItems.length}개 항목 감지됨`;
  if (!parsedItems.length) document.getElementById('parsed-preview').style.display = 'none';
}
function removeTopic(itemIdx, topicIdx) {
  parsedItems[itemIdx].topics.splice(topicIdx, 1);
  renderParsedPreview();
}
function addTopicOnEnter(e, idx, input) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = input.value.trim().replace(/,/g,'');
    if (val && !parsedItems[idx].topics.includes(val)) {
      parsedItems[idx].topics.push(val);
      renderParsedPreview();
    }
  }
}

/* ---- Save all parsed items ---- */
function saveAllParsedItems() {
  if (!parsedItems.length) { toast('저장할 항목이 없습니다'); return; }
  const now = today();

  const viralArr = getData(KEYS.viral);
  const memoArr  = getData(KEYS.memo);
  const callArr  = getData(KEYS.calls);

  let counts = {viral:0, memo:0, call:0};

  for (const item of parsedItems) {
    const title = (item.title || '(제목 없음)').trim();

    const tags = item.topics || [];

    if (item.type === 'viral') {
      viralArr.push({
        id: genId('v'), title,
        channel: guessChannel(item.content, item.url),
        type: '바이럴', category: tags[0] || '기타', author: '',
        originalDate: now, collectedAt: now,
        views: 0, likes: 0, comments: 0,
        url: item.url || '',
        aiSummary: '', tags,
        myMemo: item.content || '',
        isBest: false, isPublished: false, publishedAt: null
      });
      counts.viral++;

    } else if (item.type === 'call') {
      callArr.push({
        id: genId('c'), title,
        type: '기타', date: now, duration: 0, attendees: [],
        fullContent: item.content || '',
        aiSummary: '', actionItems: [], tags, myMemo: '',
        createdAt: now
      });
      counts.call++;

    } else {
      const memoType = item.type.replace('memo_', '') || '메모';
      memoArr.push({
        id: genId('m'), type: memoType, title,
        content: item.content || '',
        url: item.url || '',
        myThought: '', tags, aiSummary: '',
        savedAt: now
      });
      counts.memo++;
    }
  }

  saveData(KEYS.viral, viralArr);
  saveData(KEYS.memo, memoArr);
  saveData(KEYS.calls, callArr);

  const parts = [];
  if (counts.viral) parts.push(`바이럴 ${counts.viral}개`);
  if (counts.memo)  parts.push(`메모 ${counts.memo}개`);
  if (counts.call)  parts.push(`통화기록 ${counts.call}개`);
  toast(`✅ 저장 완료 — ${parts.join(', ')}`);

  quickClear();
}

function quickClear() {
  document.getElementById('quick-paste').value = '';
  document.getElementById('parsed-preview').style.display = 'none';
  parsedItems = [];
}
